    <script>
      const SNIPPETS = {
        python: `# Python
class Solution:
    def decodeString(self, s: str) -> str:
        # 栈：用于保存进入深层括号前的【外部字符串上下文】和【内部重复倍数】
        stack = []
        # curr_str: 当前括号层级正在构建的字符串
        curr_str = ""
        # curr_num: 当前正在解析的数字（处理连续多位数字）
        curr_num = 0
        
        for c in s:
            if c.isdigit():
                # 处理多位数，例如遇到 "100"，会依次计算 1 -> 10 -> 100
                curr_num = curr_num * 10 + int(c)
            elif c == '[':
                # 遇到左括号：必须保存当前层级的状态，准备进入更深一层
                # 把当前积攒的上下文 (curr_str, curr_num) 作为一个元组压栈
                stack.append((curr_str, curr_num))
                # 重置状态，开始纯净地解析当前括号里的新上下文
                curr_str = ""
                curr_num = 0
            elif c == ']':
                # 遇到右括号：当前层级的 curr_str 已经收集完毕，需要和外层拼接
                # 弹出上一层保存的上下文
                prev_str, num = stack.pop()
                # 将当前的子串放大 num 倍，然后拼接到上一层的 prev_str 后面
                # 拼接后的结果成为新的 curr_str，继续参与后续的外层循环
                curr_str = prev_str + curr_str * num
            else:
                # 遇到普通字母，直接拼接到当前层级的子串末尾
                curr_str += c
                
        return curr_str`,

        ts: `// TypeScript
function decodeString(s: string): string {
    // 采用元组类型明确界定栈的数据结构：[外层累积的字符串, 将应用于内层的重复倍数]
    let stack: [string, number][] = [];
    let currStr = "";
    let currNum = 0;

    for (let i = 0; i < s.length; i++) {
        let c = s[i];
        
        if (c >= '0' && c <= '9') {
            // 利用隐式类型转换机制，或者 parseInt 累加多位数字
            currNum = currNum * 10 + parseInt(c);
        } else if (c === '[') {
            // 状态封存：进入新括号前，将当前层级的进度推入栈中保存
            stack.push([currStr, currNum]);
            // 清空当前进度，为新一层括号内的字符串收集做准备
            currStr = "";
            currNum = 0;
        } else if (c === ']') {
            // 状态还原：遇到闭合括号，说明最内层的 currStr 构建完成
            // 使用非空断言 '!' 排除 undefined 的类型推导，解构出外层状态
            let [prevStr, num] = stack.pop()!;
            // 核心拼接逻辑：外层前缀 + 当前字符串的 num 次重复
            currStr = prevStr + currStr.repeat(num);
        } else {
            // 扫描到英文字母，持续构建当前层级的字符串
            currStr += c;
        }
    }

    return currStr;
}`,

        java: `// Java
class Solution {
    public String decodeString(String s) {
        // Java 中推荐使用 Deque 作为栈的实现，分别维护字符串栈和数字栈
        Deque<String> strStack = new LinkedList<>();
        Deque<Integer> numStack = new LinkedList<>();
        // StringBuilder 相比直接拼接 String 能大幅降低内存重分配的开销
        StringBuilder currStr = new StringBuilder();
        int currNum = 0;
        
        for (char c : s.toCharArray()) {
            if (Character.isDigit(c)) {
                // 字符转数字：利用 ASCII 码偏移量 (c - '0')
                currNum = currNum * 10 + (c - '0');
            } else if (c == '[') {
                // 压栈保存当前状态
                strStack.push(currStr.toString());
                numStack.push(currNum);
                // 重新实例化 StringBuilder 清空当前层级字符串
                currStr = new StringBuilder();
                currNum = 0;
            } else if (c == ']') {
                // 弹出上一层的字符串上下文，并以此作为基底
                StringBuilder prevStr = new StringBuilder(strStack.pop());
                int num = numStack.pop();
                // 执行重复追加逻辑
                for (int i = 0; i < num; i++) {
                    prevStr.append(currStr);
                }
                // 更新当前操作指针，指回拼接好的完整长字符串
                currStr = prevStr;
            } else {
                // 普通字符追加
                currStr.append(c);
            }
        }
        
        return currStr.toString();
    }
}`,

        cpp: `// C++
class Solution {
public:
    string decodeString(string s) {
        // 使用 std::pair 将前置字符串和倍数绑定，维持状态的高度一致性
        stack<pair<string, int>> st;
        string curr_str = "";
        int curr_num = 0;
        
        for (char c : s) {
            if (isdigit(c)) {
                // 处理多位整数
                curr_num = curr_num * 10 + (c - '0');
            } else if (c == '[') {
                // 将当前作用域的字符串和即将生效的倍数打包压栈
                st.push({curr_str, curr_num});
                // 重置当前作用域变量
                curr_str = "";
                curr_num = 0;
            } else if (c == ']') {
                // 利用 C++17 引入的结构化绑定 (Structured Binding) 优雅地提取栈顶元素
                auto [prev_str, num] = st.top();
                st.pop();
                
                // 准备进行字符串拼接
                string temp = prev_str;
                for (int i = 0; i < num; i++) {
                    temp += curr_str;
                }
                // 完成当前层级的解码，将结果赋值回 curr_str 以供后续使用
                curr_str = temp;
            } else {
                curr_str += c;
            }
        }
        return curr_str;
    }
};`,

        c: `// C (语言特性说明)
/*
 * C 语言处理此题的核心难点在于：缺乏内置的动态数组和栈结构。
 * 1. 内存管理繁琐：无法像高级语言那样使用 '+' 或 repeat() 拼接字符串，
 * 必须手动调用 malloc/calloc 分配内存，并且要在循环中频繁使用 realloc 动态扩容。
 * 2. 数据结构需手写：需要自定义一个结构体（Struct）数组来模拟栈，
 * 或者分别维护一个 int 数组（存倍数）和一个 char* 数组（存指针）作为双栈。
 * 3. 边界极难控制：需要时刻计算当前字符串的 strlen，并在末尾手动追加 '\\0'。
 * 因此，核心状态机思想（进栈保存，出栈拼接）虽然完全一致，但代码量通常是其他语言的 3 倍以上。
 */`
};

      let params = { speed: 1.0 };
      let isDone = false, isPaused = false, p5Timer = 0;
      let currentLang = "python";

      let INPUT_STR = "3[a2[c]]";
      
      let state = null;
      let gen = null;

      function setup() {
        let container = document.getElementById("canvas-container");
        let canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth, container.offsetHeight));
        switchLang("python");
        initializeSystem();
      }

      function* decodeGen() {
          let stack = [];
          let curr_str = "";
          let curr_num = 0;
          
          yield { phase: "START", s: INPUT_STR, stack: [...stack], curr_str, curr_num, i: -1, msg: "开始解析字符串" };
          
          for (let i = 0; i < INPUT_STR.length; i++) {
              let c = INPUT_STR[i];
              yield { phase: "READ", c, i, stack: [...stack], curr_str, curr_num, msg: `读取字符 '${c}'` };
              
              if (c >= '0' && c <= '9') {
                  curr_num = curr_num * 10 + parseInt(c);
                  yield { phase: "UPDATE_NUM", c, i, stack: [...stack], curr_str, curr_num, msg: "遇到数字，更新 curr_num" };
              } else if (c === '[') {
                  stack.push({ str: curr_str, num: curr_num });
                  yield { phase: "PUSH", c, i, stack: [...stack], curr_str, curr_num, msg: `遇到 '['，把当前上下文 ('${curr_str}', ${curr_num}) 封存入栈` };
                  curr_str = "";
                  curr_num = 0;
                  yield { phase: "RESET", c, i, stack: [...stack], curr_str, curr_num, msg: "清空变量，准备记录括号里的新字符串" };
              } else if (c === ']') {
                  let popped = stack.pop();
                  let prev_str = popped.str;
                  let num = popped.num;
                  yield { phase: "POP", c, i, stack: [...stack], curr_str, curr_num, prev_str, num, msg: "遇到 ']'，当前括号结束，弹出上一层上下文" };
                  
                  let repeated = "";
                  for(let k=0; k<num; k++) repeated += curr_str;
                  
                  yield { phase: "MULTIPLY", c, i, stack: [...stack], curr_str, curr_num, prev_str, num, repeated, msg: `将当前串 '${curr_str}' 放大 ${num} 倍变成 '${repeated}'` };
                  
                  curr_str = prev_str + repeated;
                  yield { phase: "COMBINE", c, i, stack: [...stack], curr_str, curr_num, prev_str, num, repeated, msg: `拼接到旧串后面：'${prev_str}' + '${repeated}' = '${curr_str}'` };
              } else {
                  curr_str += c;
                  yield { phase: "UPDATE_STR", c, i, stack: [...stack], curr_str, curr_num, msg: "遇到字母，拼接到 curr_str 后" };
              }
          }
          yield { phase: "DONE", stack: [...stack], curr_str, curr_num, i: INPUT_STR.length, msg: `解析完成！最终结果: '${curr_str}'` };
      }

      function initializeSystem() {
        isDone = false;
        isPaused = false;
        p5Timer = 0;
        state = null;

        gen = decodeGen();
        state = gen.next().value;

        let btn = document.getElementById("pause-btn");
        if (btn) { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--anthropic-dark)"; }
        document.getElementById("log-container").innerHTML = "";
        
        let headerEl = document.getElementById("phase-header");
        if (headerEl) headerEl.innerHTML = "▶ 阶段：读取并解析字符串";
        logMsg(`✅ 开始解析：<b>${INPUT_STR}</b>`, true);
      }

      function setPreset(s) {
          INPUT_STR = s;
          initializeSystem();
      }

      function drawVisuals() {
          let s = state;
          if (!s) return;
          
          let w = width;
          let h = height;
          
          // 1. Draw input string at the top
          let charBoxW = 35;
          let startX = w/2 - (INPUT_STR.length * charBoxW)/2;
          let yStr = 80;
          
          fill(150); noStroke(); textAlign(CENTER, BOTTOM); textSize(12);
          text("输入字符串 s", w/2, yStr - 25);
          
          for(let k=0; k<INPUT_STR.length; k++) {
              let cx = startX + k * charBoxW;
              
              if (k === s.i) {
                  fill(255, 237, 213); stroke(249, 115, 22); strokeWeight(2);
              } else if (k < s.i) {
                  fill(245); stroke(220); strokeWeight(1);
              } else {
                  fill(255); stroke(200); strokeWeight(1);
              }
              
              rect(cx, yStr, charBoxW - 2, 40, 4);
              
              if (k < s.i) fill(150); else fill(50);
              noStroke(); textAlign(CENTER, CENTER); textSize(18); textStyle(BOLD);
              text(INPUT_STR[k], cx + charBoxW/2 - 1, yStr + 20);
              textStyle(NORMAL);
              
              if (k === s.i) {
                  fill(249, 115, 22);
                  triangle(cx + charBoxW/2 - 5, yStr + 50, cx + charBoxW/2 + 5, yStr + 50, cx + charBoxW/2, yStr + 42);
              }
          }
          
          // 2. Current State Panel (Right)
          let panelX = w/2 + 60;
          let panelY = 200;
          
          fill(250, 250, 250); stroke(220); strokeWeight(1);
          rect(panelX, panelY, 200, 150, 8);
          
          fill(150); noStroke(); textAlign(LEFT, TOP); textSize(12);
          text("当前上下文状态 (Current Context)", panelX + 15, panelY + 15);
          
          // curr_num
          fill(50); textSize(14);
          text("curr_num:", panelX + 15, panelY + 50);
          fill(255, 243, 205); stroke(255, 193, 7); strokeWeight(1);
          rect(panelX + 90, panelY + 45, 90, 30, 4);
          fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(16); textStyle(BOLD);
          text(s.curr_num, panelX + 135, panelY + 60);
          textStyle(NORMAL);
          
          // curr_str
          textAlign(LEFT, TOP); fill(50); textSize(14);
          text("curr_str:", panelX + 15, panelY + 100);
          fill(220, 252, 231); stroke(34, 197, 94); strokeWeight(1);
          rect(panelX + 90, panelY + 95, 90, 30, 4);
          fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(16); textStyle(BOLD);
          let displayStr = s.curr_str;
          if (displayStr.length > 8) displayStr = "..." + displayStr.substring(displayStr.length - 7);
          text(displayStr || '""', panelX + 135, panelY + 110);
          textStyle(NORMAL);
          
          // 3. Stack Visual (Left)
          let stackX = w/2 - 200;
          let stackYBase = 450;
          let stackW = 160;
          let stackH = 50;
          
          fill(150); noStroke(); textAlign(CENTER, BOTTOM); textSize(14);
          text("上下文栈 (Stack)", stackX, stackYBase + 30);
          
          stroke(200); strokeWeight(3); noFill();
          beginShape();
          vertex(stackX - stackW/2, stackYBase - 4 * stackH);
          vertex(stackX - stackW/2, stackYBase);
          vertex(stackX + stackW/2, stackYBase);
          vertex(stackX + stackW/2, stackYBase - 4 * stackH);
          endShape();
          
          for(let idx = 0; idx < (s.stack || []).length; idx++) {
              let item = s.stack[idx];
              let cy = stackYBase - idx * stackH - stackH/2;
              
              let highlight = (idx === s.stack.length - 1 && s.phase === "PUSH");
              
              fill(highlight ? 224 : 240, highlight ? 242 : 248, highlight ? 254 : 255);
              stroke(highlight ? 59 : 150, highlight ? 130 : 200, highlight ? 246 : 255);
              strokeWeight(2);
              rect(stackX - stackW/2 + 4, cy - stackH/2 + 4, stackW - 8, stackH - 8, 4);
              
              fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(14);
              let sDisp = item.str.length > 5 ? item.str.substring(0, 4) + ".." : item.str;
              text(`('${sDisp || ""}', ${item.num})`, stackX, cy);
          }
          
          // 4. Action floaters
          if (s.phase === "MULTIPLY" || s.phase === "COMBINE") {
              let fy = panelY + 180;
              fill(254, 215, 170); stroke(234, 88, 12); strokeWeight(2);
              rect(panelX, fy, 200, 60, 6);
              fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(13);
              if (s.phase === "MULTIPLY") {
                  text(`放大: '${s.curr_str}' × ${s.num}`, panelX + 100, fy + 20);
                  textStyle(BOLD); fill(234, 88, 12);
                  text(`=> '${s.repeated}'`, panelX + 100, fy + 40);
                  textStyle(NORMAL);
              } else {
                  text(`拼接: '${s.prev_str}' + '${s.repeated}'`, panelX + 100, fy + 20);
                  textStyle(BOLD); fill(34, 197, 94);
                  text(`=> '${s.curr_str}'`, panelX + 100, fy + 40);
                  textStyle(NORMAL);
              }
          }
      }
      
      function varColor(name) {
          return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function draw() {
        background(255);
        if (state) drawVisuals();

        if (!isDone && !isPaused) {
          p5Timer += 0.015 * params.speed;
          if (p5Timer > 1) {
            p5Timer = 0;
            performStep();
          }
        }
      }

      function performStep() {
        let nxt = gen.next();
        if (nxt.done) {
            if (!isDone) isDone = true;
            return;
        }

        state = nxt.value;
        let s = state;

        if (s.phase === "START") {
            logMsg(s.msg, false);
        } else if (s.phase === "UPDATE_NUM") {
            logMsg(`🔢 ${s.msg} => <b>${s.curr_num}</b>`, false);
        } else if (s.phase === "PUSH") {
            logMsg(`📥 ${s.msg}`, true);
        } else if (s.phase === "RESET") {
            logMsg(`🧹 ${s.msg}`, false);
        } else if (s.phase === "POP") {
            logMsg(`📤 ${s.msg} => 提取旧环境: <b>str='${s.prev_str}', num=${s.num}</b>`, true);
        } else if (s.phase === "MULTIPLY") {
            logMsg(`✨ ${s.msg}`, false);
        } else if (s.phase === "COMBINE") {
            logMsg(`🔗 ${s.msg}`, true);
        } else if (s.phase === "UPDATE_STR") {
            logMsg(`📝 ${s.msg} => <b>'${s.curr_str}'</b>`, false);
        } else if (s.phase === "DONE") {
            logMsg(`\n🎉 ${s.msg}`, true);
            let headerEl = document.getElementById("phase-header");
            if (headerEl) headerEl.innerHTML = "🏁 解码完成";
        }
      }

      function logMsg(msg, highlight = false) {
        let container = document.getElementById("log-container");
        if (!container) return;
        let item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "");
        let time = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="time">${time}</div><div style="font-family:'JetBrains Mono',monospace">${msg}</div>`;
        container.appendChild(item);
        container.scrollTop = container.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        const tabs = document.querySelectorAll(".tab");
        const langMap = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        tabs[langMap[lang]].classList.add("active");

        const codeEl = document.getElementById("code-viewer");
        const hljsMap = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hljsMap[lang];
        codeEl.textContent = SNIPPETS[lang];

        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        let display = document.getElementById(id + "-value");
        if (display) display.textContent = val;
      }

      function togglePause() {
        isPaused = !isPaused;
        let btn = document.getElementById("pause-btn");
        if (!btn) return;
        if (isPaused) { btn.innerHTML = "▶ 继续"; btn.style.background = "var(--anthropic-green)"; }
        else { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--anthropic-dark)"; }
      }
    </script>
  </body>
</html>
