    <style>
      :root {
        --dark: #141413;
        --line: #e8e6dc;
        --mid: #b0aea5;
        --orange: #d97757;
        --blue: #6a9bcc;

      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Poppins", "PingFang SC", sans-serif; background: #fdfcf9; color: var(--dark); overflow: hidden; }
      .container { display: flex; height: 100vh; padding: 15px; gap: 15px; }
      .sidebar { width: 280px; flex-shrink: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; overflow-y: auto; }

      .control-section { margin-bottom: 18px; }
      .control-section h3 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
      .control-section h3::before { content: ""; width: 4px; height: 14px; background: var(--orange); border-radius: 2px; }
      .control-group { margin-bottom: 10px; }
      .control-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #666; }
      .slider-container { display: flex; align-items: center; gap: 10px; }
      input[type="range"] { flex: 1; height: 4px; background: var(--line); border-radius: 2px; appearance: none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--orange); border-radius: 50%; border: 2px solid #fff; }
      .value-display { font-family: "JetBrains Mono", monospace; font-size: 11px; min-width: 24px; text-align: right; }
      .seed-input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; font-family: "JetBrains Mono", monospace; font-size: 12px; }
      .button { width: 100%; border: none; background: var(--orange); color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
      .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .preset { border: 1px solid var(--line); border-radius: 6px; padding: 7px 6px; background: #fff; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer; }
      .canvas-area { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      .canvas-header { padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: #888; display: flex; justify-content: space-between; }
      #canvas-container { flex: 1; width: 100%; height: 100%; }
      .right-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 15px; }
      .code-box { flex: 1.08; background: #1e1e1e; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      .box-header.dark { background: #282828; border-bottom: 1px solid #1e1e1e; padding: 10px 15px 0; display: flex; justify-content: space-between; align-items: center; }
      .box-title.dark { color: #ccc; font-size: 12px; font-weight: 600; padding-bottom: 10px; }
      .tabs.dark { display: flex; gap: 1px; align-items: flex-end; }
      .tabs.dark .tab { padding: 8px 16px; background: #2d2d2d; color: #888; border-radius: 6px 6px 0 0; font-size: 11px; cursor: pointer; }
      .tabs.dark .tab.active { background: #1e1e1e; color: #4ec9b0; border-top: 2px solid #007acc; }

      .data-title { font-size: 11px; font-weight: 600; color: var(--orange); margin-bottom: 6px; text-transform: uppercase; }

      .data-node { width: 26px; height: 26px; background: var(--orange); color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; }
      .log-area { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; }

      .memo-card h3 { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
      .memo-badges { display: flex; gap: 6px; margin-bottom: 10px; }
      .memo-badge { padding: 2px 8px; border-radius: 4px; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; }
      .memo-time { background: #fff3ee; color: var(--orange); border: 1px solid #f0c8b0; }
      .memo-space { background: #eef3ff; color: var(--blue); border: 1px solid #b8d0f0; }
      .memo-tip { padding: 6px 9px; font-size: 11px; line-height: 1.5; color: #555; background: #fffcf9; border-left: 3px solid var(--orange); border-radius: 0 5px 5px 0; margin-bottom: 6px; }
      .memo-tip.g { border-left-color: var(--green); }
      .memo-tip.w { border-left-color: #e8a838; background: #fffdf2; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>最长递增子序列</h1>
        <div class="subtitle">LeetCode 300 · tails + 二分优化</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="30001" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">生成随机样例</button>
        </div>
        <div class="control-section">
          <h3>参数控制</h3>
          <div class="control-group">
            <label>动画速度</label>
            <div class="slider-container">
              <input type="range" id="speed" min="0.1" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)" />
              <span class="value-display" id="speed-value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>数组长度</label>
            <div class="slider-container">
              <input type="range" id="n" min="5" max="14" step="1" value="8" oninput="updateParam('n', this.value)" />
              <span class="value-display" id="n-value">8</span>
            </div>
          </div>
          <div class="control-group">
            <label>预设样例</label>
            <div class="preset-grid">
              <button class="preset" onclick="setPreset('10,9,2,5,3,7,101,18')">10,9,2,5...</button>
              <button class="preset" onclick="setPreset('0,1,0,3,2,3')">0,1,0,3,2,3</button>
              <button class="preset" onclick="setPreset('7,7,7,7,7,7')">7,7,7,7,7,7</button>
              <button class="preset" onclick="setPreset('4,10,4,3,8,9')">4,10,4,3,8,9</button>
            </div>
          </div>
        </div>
        <div class="control-section" style="display:flex; gap:10px">
          <button id="pause-btn" class="button" style="background:var(--dark)" onclick="togglePause()">⏸ 暂停</button>
          <button class="button" style="background:var(--blue)" onclick="resetAnimation()">🔄 重新运行</button>
        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(n log n)</span>
            <span class="memo-badge memo-space">空间 O(n)</span>
          </div>
          <div class="memo-tip">tails[k] 表示“长度为 k+1 的递增子序列”里，结尾元素最小可能值。</div>
          <div class="memo-tip g">新元素 x 用二分找到第一个 >= x 的位置替换，保持 tails 递增且尽量小。</div>
          <div class="memo-tip w">tails 长度就是 LIS 长度，但 tails 本身不一定是某个真实子序列。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>tails 迭代更新可视化</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">输入数组</div>
            <div id="data-nodes" class="data-array"></div>
          </div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
from bisect import bisect_left

def lengthOfLIS(nums: list[int]) -> int:
    tails = []  # tails[k] = length k+1 的最小结尾
    for x in nums:
        # 找到第一个 >= x 的位置
        i = bisect_left(tails, x)
        if i == len(tails):
            # x 比所有结尾都大，可扩展长度
            tails.append(x)
        else:
            # 用更小结尾替换，优化后续扩展潜力
            tails[i] = x
    return len(tails)`,
        ts: `// TypeScript
function lengthOfLIS(nums: number[]): number {
  const tails: number[] = [];
  for (const x of nums) {
    // 二分查找第一个满足 tails[i] >= x 的位置
    let l = 0, r = tails.length;
    while (l < r) {
      const m = (l + r) >> 1;
      if (tails[m] < x) l = m + 1;
      else r = m;
    }
    // 若 x 更大则扩展长度，否则替换为更小结尾
    if (l === tails.length) tails.push(x);
    else tails[l] = x;
  }
  return tails.length;
}`,
        java: `// Java
class Solution {
  public int lengthOfLIS(int[] nums) {
    int[] tails = new int[nums.length];
    int size = 0; // tails 当前有效长度
    for (int x : nums) {
      // 二分查找第一个满足 tails[i] >= x 的位置
      int l = 0, r = size;
      while (l < r) {
        int m = (l + r) >>> 1;
        if (tails[m] < x) l = m + 1;
        else r = m;
      }
      // 在位置 l 写入（追加或替换）
      tails[l] = x;
      if (l == size) size++;
    }
    return size;
  }
}`,
        cpp: `// C++
class Solution {
public:
  int lengthOfLIS(vector<int>& nums) {
    vector<int> tails;
    for (int x : nums) {
      // lower_bound 定位第一个 >= x 的位置
      auto it = lower_bound(tails.begin(), tails.end(), x);
      if (it == tails.end()) tails.push_back(x); // 扩展 LIS 长度
      else *it = x; // 替换为更小结尾，保留扩展潜力
    }
    return (int)tails.size();
  }
};`,
        c: `// C
int lengthOfLIS(int* nums, int numsSize) {
  int* tails = (int*)malloc(sizeof(int) * numsSize);
  int size = 0; // tails 的有效长度
  for (int k = 0; k < numsSize; k++) {
    int x = nums[k];
    // 二分查找第一个满足 tails[i] >= x 的位置
    int l = 0, r = size;
    while (l < r) {
      int m = (l + r) >> 1;
      if (tails[m] < x) l = m + 1;
      else r = m;
    }
    // 在位置 l 处追加或替换
    tails[l] = x;
    if (l == size) size++;
  }
  free(tails);
  return size;
}`
      };

      let params = { seed: 30001, speed: 1.0, n: 8 };
      let currentLang = "python";
      let arr = [];
      let tails = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let idx = 0;
      let ptrX = 0;
      let ptrTargetX = 0;
      let stepInfo = null;

      function makeRng(seed) {
        let s = (seed >>> 0) || 1;
        return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth, container.offsetHeight));
        switchLang("python");
      }

      function initializeSystem() {
        arr = presetRaw ? parsePreset(presetRaw) : generateArray(params.n, params.seed);
        if (arr.length < 2) arr = [3, 1];
        tails = [];
        isDone = false;
        isPaused = false;
        timer = 0;
        idx = 0;
        stepInfo = null;
        ptrX = 70;
        ptrTargetX = 70;
        document.getElementById("log-container").innerHTML = "";
        updateDataUI(arr);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`输入数组：${arr.join(", ")}。初始 tails 为空。`, true);
      }

      function parsePreset(raw) {
        return raw.split(",").map((s) => parseInt(s.trim(), 10)).filter((v) => Number.isFinite(v));
      }

      function generateArray(n, seed) {
        const rand = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i++) out.push(floor(rand() * 30));
        return out;
      }

      function draw() {
        background(255);
        drawArrays();
        drawStatus();
        if (isPaused || isDone) return;
        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 1.0) {
          performStep();
          timer = 0;
        }
      }

      function drawArrays() {
        const gap = Math.max(30, Math.min(54, (width - 130) / Math.max(arr.length - 1, 1)));
        const nodeW = Math.max(24, Math.min(36, gap - 4));
        const nodeH = 40;
        const startX = Math.max(54, width / 2 - ((arr.length - 1) * gap) / 2);
        const y = 140;
        ptrX = lerp(ptrX, ptrTargetX, 0.12 * params.speed);

        fill(90); noStroke(); textSize(13); textAlign(LEFT, CENTER); text("输入数组 nums", 24, 68);

        for (let i = 0; i < arr.length; i++) {
          const cx = startX + i * gap;
          const active = i === idx && !isDone;
          let fillColor = "#fff", strokeColor = "#ddd";
          if (i < idx) { fillColor = "#eef3ff"; strokeColor = "#6a9bcc"; }
          if (active) { fillColor = "#fff3ee"; strokeColor = "#d97757"; }
          stroke(strokeColor); strokeWeight(active ? 2.2 : 1.2); fill(fillColor);
          rect(cx - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 7);
          noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(nodeW < 30 ? 14 : 16); text(arr[i], cx, y);
          fill("#aaa"); textSize(10); text(i, cx, y + 30);
        }

        if (!isDone && idx < arr.length) {
          stroke("#d97757"); strokeWeight(2); line(ptrX, y + 52, ptrX, y + 26);
          fill("#d97757"); noStroke(); triangle(ptrX, y + 20, ptrX - 5, y + 30, ptrX + 5, y + 30);
          fill("#d97757"); textSize(11); text("x", ptrX, y + 66);
        }

        const tailsY = 260;
        fill(90); noStroke(); textSize(13); textAlign(LEFT, CENTER); text("tails（当前最小结尾数组）", 24, 214);
        for (let i = 0; i < tails.length; i++) {
          const cx = startX + i * gap;
          const hit = stepInfo && stepInfo.pos === i;
          stroke(hit ? "#d97757" : "#6a9bcc");
          strokeWeight(hit ? 2.2 : 1.2);
          fill(hit ? "#fff3ee" : "#eef3ff");
          rect(cx - nodeW / 2, tailsY - nodeH / 2, nodeW, nodeH, 7);
          noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(nodeW < 30 ? 14 : 16); text(tails[i], cx, tailsY);
          fill("#aaa"); textSize(10); text(i, cx, tailsY + 30);
        }
      }

      function drawStatus() {
        const bw = Math.min(430, width - 48);
        const bh = 150;
        const bx = (width - bw) / 2;
        const minBy = 332;
        const maxBy = height - bh - 16;
        const by = Math.max(minBy, Math.min(maxBy, height / 2 + 110));
        fill("#fffcf9"); stroke("#e8e6dc"); strokeWeight(1.4); rect(bx, by, bw, bh, 10);
        noStroke();
        textAlign(CENTER, CENTER);
        fill("#666"); textSize(12); text(`idx=${Math.min(idx, arr.length)}  LIS长度=${tails.length}`, bx + bw / 2, by + 24);
        textAlign(LEFT, CENTER);
        textSize(14);
        if (stepInfo) {
          fill("#6a9bcc"); text(`x=${stepInfo.x}，二分位置 pos=${stepInfo.pos}`, bx + 20, by + 58);
          fill("#788c5d"); text(`操作：${stepInfo.append ? "追加 tails" : "替换 tails[pos]"}`, bx + 20, by + 86);
          fill("#444"); text(`tails=${JSON.stringify(tails)}`, bx + 20, by + 114);
        } else {
          fill("#777"); text("等待第一步转移...", bx + 20, by + 86);
        }
      }

      // 每步对 x 执行 lower_bound，再追加或替换 tails
      function performStep() {
        if (idx >= arr.length) {
          isDone = true;
          updateResult(`LIS 长度：${tails.length}`, "var(--green)");
          logMsg(`计算结束，LIS 长度 = ${tails.length}。`, true, "success");
          return;
        }

        const x = arr[idx];
        let l = 0, r = tails.length;
        while (l < r) {
          const m = (l + r) >> 1;
          if (tails[m] < x) l = m + 1;
          else r = m;
        }
        const pos = l;
        const append = pos === tails.length;
        if (append) tails.push(x);
        else tails[pos] = x;
        stepInfo = { x, pos, append };

        const gap = Math.max(30, Math.min(54, (width - 130) / Math.max(arr.length - 1, 1)));
        const startX = Math.max(54, width / 2 - ((arr.length - 1) * gap) / 2);
        ptrTargetX = startX + idx * gap;

        logMsg(`i=${idx}, x=${x}：lower_bound 位置=${pos}，${append ? "追加" : "替换"} tails，当前长度=${tails.length}。`, true);
        idx += 1;

        if (idx >= arr.length) {
          isDone = true;
          updateResult(`LIS 长度：${tails.length}`, "var(--green)");
          logMsg(`全部处理完成，LIS 长度 = ${tails.length}。`, true, "success");
        }
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function updateDataUI(array) {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        array.forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          c.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");
        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
        if (id !== "speed") {
          presetRaw = "";
          initializeSystem();
        }
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 30001;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function setPreset(raw) {
        presetRaw = raw;
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
