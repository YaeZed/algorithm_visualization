<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多数元素 - LeetCode 169</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
    <style>
      :root { --dark:#141413; --line:#e8e6dc; --orange:#d97757; --blue:#6a9bcc; --green:#788c5d; --mid:#b0aea5; }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:"Poppins","PingFang SC",sans-serif; background:#fdfcf9; color:var(--dark); overflow:hidden; }
      .container { display:flex; height:100vh; padding:15px; gap:15px; }
      .sidebar { width:280px; flex-shrink:0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; overflow-y:auto; }
      .sidebar h1 { font-family:"Lora",serif; font-size:18px; color:var(--orange); margin-bottom:4px; }
      .subtitle { font-size:11px; color:var(--mid); margin-bottom:20px; }
      .control-section { margin-bottom:18px; }
      .control-section h3 { font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
      .control-section h3::before { content:""; width:4px; height:14px; background:var(--orange); border-radius:2px; }
      .control-group { margin-bottom:10px; }
      .control-group label { display:block; font-size:12px; margin-bottom:4px; color:#666; }
      .slider-container { display:flex; align-items:center; gap:10px; }
      input[type="range"] { flex:1; height:4px; background:var(--line); border-radius:2px; appearance:none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:var(--orange); border-radius:50%; border:2px solid #fff; }
      .value-display { font-family:"JetBrains Mono",monospace; font-size:11px; min-width:24px; text-align:right; }
      .seed-input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; font-family:"JetBrains Mono",monospace; font-size:12px; }
      .button { width:100%; border:none; background:var(--orange); color:#fff; border-radius:6px; padding:10px; font-size:13px; font-weight:500; cursor:pointer; }
      .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
      .preset { border:1px solid var(--line); border-radius:6px; padding:7px 6px; background:#fff; font-family:"JetBrains Mono",monospace; font-size:11px; cursor:pointer; }
      .canvas-area { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
      .canvas-header { padding:10px 20px; border-bottom:1px solid var(--line); font-size:13px; color:#888; display:flex; justify-content:space-between; }
      #canvas-container { flex:1; width:100%; height:100%; }
      .right-panel { flex:1; min-width:0; display:flex; flex-direction:column; gap:15px; }
      .code-box { flex:1.08; background:#1e1e1e; border:1px solid #333; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
      .box-header.dark { background:#282828; border-bottom:1px solid #1e1e1e; padding:10px 15px 0; display:flex; justify-content:space-between; align-items:center; }
      .box-title.dark { color:#ccc; font-size:12px; font-weight:600; padding-bottom:10px; }
      .tabs.dark { display:flex; gap:1px; align-items:flex-end; }
      .tabs.dark .tab { padding:8px 16px; background:#2d2d2d; color:#888; border-radius:6px 6px 0 0; font-size:11px; cursor:pointer; }
      .tabs.dark .tab.active { background:#1e1e1e; color:#4ec9b0; border-top:2px solid #007acc; }
      .code-content { flex:1; margin:0; overflow:auto; }
      #code-viewer { font-family:Consolas,"JetBrains Mono",monospace; font-size:14px; line-height:1.55; color:#d4d4d4; padding:15px; }
      .logic-box { flex:.92; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
      .box-header { padding:8px 15px; border-bottom:1px solid #eee; }
      .box-title { font-size:12px; font-weight:600; color:#555; }
      .data-viz { padding:12px; background:#fffcf9; border-bottom:1px solid #eee; }
      .data-title { font-size:11px; font-weight:600; color:var(--orange); margin-bottom:6px; text-transform:uppercase; }
      .data-array { display:flex; flex-wrap:wrap; gap:5px; min-height:30px; }
      .data-node { width:26px; height:26px; background:var(--orange); color:#fff; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; }
      .log-area { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:11.5px; }
      .log-item { padding:6px 10px; border-radius:4px; background:#fcfcfc; border-left:2px solid #ddd; color:#444; line-height:1.4; }
      .log-item.highlight { border-left-color:var(--orange); background:#fff9f5; font-weight:500; }
      .log-item .log-time { font-size:9px; color:#aaa; margin-bottom:2px; }
      .memo-card { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
      .memo-card h3 { font-size:12px; font-weight:600; margin-bottom:10px; }
      .memo-badges { display:flex; gap:6px; margin-bottom:10px; }
      .memo-badge { padding:2px 8px; border-radius:4px; font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600; }
      .memo-time { background:#fff3ee; color:var(--orange); border:1px solid #f0c8b0; }
      .memo-space { background:#eef3ff; color:var(--blue); border:1px solid #b8d0f0; }
      .memo-tip { padding:6px 9px; font-size:11px; line-height:1.5; color:#555; background:#fffcf9; border-left:3px solid var(--orange); border-radius:0 5px 5px 0; margin-bottom:6px; }
      .memo-tip.g { border-left-color:var(--green); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h1>多数元素</h1>
        <div class="subtitle">LeetCode 169 · Boyer-Moore 投票</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="16901" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">生成随机样例</button>
        </div>
        <div class="control-section">
          <h3>参数控制</h3>
          <div class="control-group">
            <label>动画速度</label>
            <div class="slider-container"><input type="range" id="speed" min="0.1" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)" /><span class="value-display" id="speed-value">1.0</span></div>
          </div>
          <div class="control-group">
            <label>数组长度（奇数）</label>
            <div class="slider-container"><input type="range" id="n" min="5" max="17" step="2" value="9" oninput="updateParam('n', this.value)" /><span class="value-display" id="n-value">9</span></div>
          </div>
          <div class="control-group">
            <label>预设样例</label>
            <div class="preset-grid">
              <button class="preset" onclick="setPreset('3,2,3')">3,2,3</button>
              <button class="preset" onclick="setPreset('2,2,1,1,1,2,2')">2,2,1,1,1,2,2</button>
              <button class="preset" onclick="setPreset('5,5,4,5,3,5,5')">5,5,4,5,3,5,5</button>
              <button class="preset" onclick="setPreset('7,6,7,7,5,7,7')">7,6,7,7,5,7,7</button>
            </div>
          </div>
        </div>
        <div class="control-section" style="display:flex; gap:10px">
          <button id="pause-btn" class="button" style="background:var(--dark)" onclick="togglePause()">⏸ 暂停</button>
          <button class="button" style="background:var(--blue)" onclick="resetAnimation()">🔄 重新运行</button>
        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges"><span class="memo-badge memo-time">时间 O(n)</span><span class="memo-badge memo-space">空间 O(1)</span></div>
          <div class="memo-tip">`count` 表示当前候选值相对其他值的净票数。</div>
          <div class="memo-tip">遇到同候选值就加一，遇到不同值就减一，相当于两两抵消。</div>
          <div class="memo-tip g">当 `count` 归零时，之前信息全部抵消，下一位可以成为新候选。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>投票抵消过程可视化</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz"><div class="data-title">数组状态</div><div id="data-nodes" class="data-array"></div></div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def majorityElement(nums: list[int]) -> int:
    # candidate 保存当前候选值，count 保存净票数
    candidate, count = 0, 0
    for x in nums:
        # 净票数归零时，说明上一轮候选和其他值已抵消
        if count == 0:
            candidate = x
        # 同值加票，不同值减票
        count += 1 if x == candidate else -1
    return candidate`,
        ts: `// TypeScript
function majorityElement(nums: number[]): number {
  // candidate: 当前候选值；count: candidate 的净票数
  let candidate = 0;
  let count = 0;
  for (const x of nums) {
    // 净票数归零，切换候选人
    if (count === 0) candidate = x;
    // 相同元素 +1，不同元素 -1（相互抵消）
    count += (x === candidate ? 1 : -1);
  }
  // 题目保证众数存在，最终 candidate 即答案
  return candidate;
}`,
        java: `// Java
class Solution {
    public int majorityElement(int[] nums) {
        // candidate: 当前候选值；count: 净票数
        int candidate = 0, count = 0;
        for (int x : nums) {
            // 票数清零时，重置候选值
            if (count == 0) candidate = x;
            // 与候选值相同就加票，否则减票
            count += (x == candidate ? 1 : -1);
        }
        // 众数一定存在，最终 candidate 即众数
        return candidate;
    }
}`,
        cpp: `// C++
class Solution {
public:
    int majorityElement(vector<int>& nums) {
        // candidate: 当前候选值；count: 净票数
        int candidate = 0, count = 0;
        for (int x : nums) {
            // 票数归零，说明前一段已经完全抵消
            if (count == 0) candidate = x;
            // 相同加一票，不同减一票
            count += (x == candidate ? 1 : -1);
        }
        // 题目保证有众数，candidate 即结果
        return candidate;
    }
};`,
        c: `// C
int majorityElement(int* nums, int numsSize) {
    // candidate: 当前候选值；count: 净票数
    int candidate = 0, count = 0;
    for (int i = 0; i < numsSize; i++) {
        // count 为 0 时，更新候选值
        if (count == 0) candidate = nums[i];
        // 与候选值相同加票，否则减票
        count += (nums[i] == candidate ? 1 : -1);
    }
    // 题目保证众数存在，最终 candidate 即答案
    return candidate;
}`,
      };

      const LANG_VARS = {
        python: { cand: "candidate", cnt: "count", cur: "x" },
        ts: { cand: "candidate", cnt: "count", cur: "x" },
        java: { cand: "candidate", cnt: "count", cur: "x" },
        cpp: { cand: "candidate", cnt: "count", cur: "x" },
        c: { cand: "candidate", cnt: "count", cur: "nums[i]" },
      };

      let params = { seed: 16901, speed: 1.0, n: 9 };
      let currentLang = "python";
      let arr = [];
      let i = 0;
      let candidate = 0;
      let count = 0;
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let presetRaw = "";
      let pointerX = 80;
      let pointerTargetX = 80;

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth, container.offsetHeight));
        switchLang("python");
      }

      function initializeSystem() {
        randomSeed(params.seed);
        arr = presetRaw ? presetRaw.split(",").map((s) => parseInt(s.trim(), 10)) : generateArray(params.n);
        i = 0;
        candidate = 0;
        count = 0;
        isDone = false;
        isPaused = false;
        timer = 0;
        pointerX = 80;
        pointerTargetX = 80;
        document.getElementById("log-container").innerHTML = "";
        updateDataUI(arr);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn"); btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--dark)";
        logMsg(`输入数组：${arr.join(", ")}。开始 Boyer-Moore 投票。`, true);
      }

      function generateArray(n) {
        const major = floor(random(1, 9));
        const need = floor(n / 2) + 1;
        const out = [];
        for (let k = 0; k < need; k++) out.push(major);
        while (out.length < n) {
          const x = floor(random(1, 9));
          if (x !== major) out.push(x);
        }
        for (let k = out.length - 1; k > 0; k--) {
          const j = floor(random(k + 1));
          [out[k], out[j]] = [out[j], out[k]];
        }
        return out;
      }

      function draw() {
        background(255);
        drawArray();
        drawStatus();
        if (!isDone && !isPaused) {
          timer += 0.018 * params.speed;
          if (timer > 1) {
            timer = 0;
            performStep();
          }
        }
      }

      function drawArray() {
        const gap = Math.max(28, Math.min(52, (width - 150) / Math.max(arr.length - 1, 1)));
        const startX = 80;
        const y = 145;
        pointerX = lerp(pointerX, pointerTargetX, 0.12 * params.speed);
        fill(90); noStroke(); textSize(13); textAlign(LEFT, CENTER);
        text("输入数组 nums", 30, 70);
        for (let k = 0; k < arr.length; k++) {
          const cx = startX + k * gap;
          const active = k === i && !isDone;
          const isCand = arr[k] === candidate && count > 0;
          stroke(active ? "#d97757" : (isCand ? "#6a9bcc" : "#ddd"));
          strokeWeight(active ? 2.2 : 1.2);
          fill(active ? "#fff3ee" : (isCand ? "#eef3ff" : "#fff"));
          rect(cx - 18, y - 20, 36, 40, 7);
          noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(16); text(arr[k], cx, y);
          fill("#aaa"); textSize(10); text(k, cx, y + 30);
        }
        if (!isDone) {
          stroke("#d97757"); strokeWeight(2); line(pointerX, y + 50, pointerX, y + 26);
          fill("#d97757"); noStroke(); triangle(pointerX, y + 20, pointerX - 5, y + 30, pointerX + 5, y + 30);
          fill("#d97757"); textSize(11); text(LANG_VARS[currentLang].cur, pointerX, y + 66);
        }
      }

      function drawStatus() {
        const bx = width / 2 - 120;
        const by = height / 2 + 50;
        fill("#fffcf9"); stroke("#e8e6dc"); strokeWeight(1.4); rect(bx, by, 240, 120, 10);
        noStroke(); fill("#666"); textAlign(CENTER, CENTER); textSize(12);
        text(`${LANG_VARS[currentLang].cand} / ${LANG_VARS[currentLang].cnt}`, bx + 120, by + 24);
        fill("#6a9bcc"); textSize(24); text(`candidate = ${candidate}`, bx + 120, by + 56);
        fill("#d97757"); textSize(26); text(`count = ${count}`, bx + 120, by + 88);
      }

      function performStep() {
        if (i >= arr.length) {
          isDone = true;
          updateResult(`完成，答案 = ${candidate}`, "var(--green)");
          logMsg(`遍历结束，最终候选值 ${candidate} 即多数元素。`, true);
          return;
        }
        pointerTargetX = 80 + i * Math.max(28, Math.min(52, (width - 150) / Math.max(arr.length - 1, 1)));
        const x = arr[i];
        if (count === 0) {
          candidate = x;
          logMsg(`${LANG_VARS[currentLang].cnt} 为 0，重置 ${LANG_VARS[currentLang].cand} = ${x}。`, true);
        }
        const before = count;
        count += (x === candidate ? 1 : -1);
        logMsg(`读取 ${x}，${x === candidate ? "同票 +1" : "异票 -1"}：${before} -> ${count}。`, false);
        i++;
      }

      function setPreset(s) {
        presetRaw = s;
        params.n = s.split(",").length;
        document.getElementById("n").value = params.n;
        document.getElementById("n-value").textContent = params.n;
        initializeSystem();
      }

      function updateResult(text, color) { const el = document.getElementById("result-label"); el.textContent = text; el.style.color = color; }
      function updateDataUI(array) { const container = document.getElementById("data-nodes"); container.innerHTML = ""; array.forEach((v) => { const node = document.createElement("div"); node.className = "data-node"; node.textContent = v; container.appendChild(node); }); }
      function logMsg(msg, highlight = false) { const c = document.getElementById("log-container"); const item = document.createElement("div"); item.className = "log-item" + (highlight ? " highlight" : ""); const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }); item.innerHTML = `<div class="log-time">${t}</div>${msg}`; c.appendChild(item); c.scrollTop = c.scrollHeight; }
      function switchLang(lang) { currentLang = lang; document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active")); const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 }; document.querySelectorAll(".tab")[map[lang]].classList.add("active"); const codeEl = document.getElementById("code-viewer"); const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" }; codeEl.className = "hljs " + hl[lang]; codeEl.textContent = SNIPPETS[lang]; codeEl.removeAttribute("data-highlighted"); if (window.hljs) hljs.highlightElement(codeEl); initializeSystem(); }
      function updateParam(id, val) { if (id in params) params[id] = parseFloat(val); document.getElementById(id + "-value").textContent = val; if (id !== "speed") { presetRaw = ""; initializeSystem(); } }
      function updateSeed() { params.seed = parseInt(document.getElementById("seed-input").value, 10) || 16901; presetRaw = ""; initializeSystem(); }
      function randomSeedAndUpdate() { params.seed = floor(random(1, 99999)); document.getElementById("seed-input").value = params.seed; presetRaw = ""; initializeSystem(); }
      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() { initializeSystem(); }
    </script>
  </body>
</html>
