    <script>
      const SNIPPETS = {
        python: `# Python
def minPathSum(grid: list[list[int]]) -> int:
    m, n = len(grid), len(grid[0])
    # dp[i][j]：到达 (i,j) 的最小路径和
    dp = [[0] * n for _ in range(m)]

    for i in range(m):
        for j in range(n):
            if i == 0 and j == 0:
                dp[i][j] = grid[i][j]
            elif i == 0:
                # 第一行只能从左边来
                dp[i][j] = dp[i][j - 1] + grid[i][j]
            elif j == 0:
                # 第一列只能从上边来
                dp[i][j] = dp[i - 1][j] + grid[i][j]
            else:
                # 普通格子取上/左较小值
                dp[i][j] = min(dp[i - 1][j], dp[i][j - 1]) + grid[i][j]
    return dp[m - 1][n - 1]`,
        ts: `// TypeScript
function minPathSum(grid: number[][]): number {
  const m = grid.length;
  const n = grid[0].length;
  // dp[i][j]：走到 (i,j) 的最小路径和
  const dp = Array.from({ length: m }, () => new Array(n).fill(0));

  for (let i = 0; i < m; i++) {
    for (let j = 0; j < n; j++) {
      if (i === 0 && j === 0) dp[i][j] = grid[i][j];
      else if (i === 0) dp[i][j] = dp[i][j - 1] + grid[i][j];
      else if (j === 0) dp[i][j] = dp[i - 1][j] + grid[i][j];
      else {
        // 普通格子：上方和左方取较小值
        dp[i][j] = Math.min(dp[i - 1][j], dp[i][j - 1]) + grid[i][j];
      }
    }
  }
  return dp[m - 1][n - 1];
}`,
        java: `// Java
class Solution {
  public int minPathSum(int[][] grid) {
    int m = grid.length, n = grid[0].length;
    // dp[i][j]：到达该格子的最小代价
    int[][] dp = new int[m][n];

    for (int i = 0; i < m; i++) {
      for (int j = 0; j < n; j++) {
        if (i == 0 && j == 0) dp[i][j] = grid[i][j];
        else if (i == 0) dp[i][j] = dp[i][j - 1] + grid[i][j];
        else if (j == 0) dp[i][j] = dp[i - 1][j] + grid[i][j];
        else {
          // 从上或左转移，取更小路径
          dp[i][j] = Math.min(dp[i - 1][j], dp[i][j - 1]) + grid[i][j];
        }
      }
    }
    return dp[m - 1][n - 1];
  }
}`,
        cpp: `// C++
class Solution {
public:
  int minPathSum(vector<vector<int>>& grid) {
    int m = (int)grid.size(), n = (int)grid[0].size();
    // dp[i][j]：从起点到 (i,j) 的最小路径和
    vector<vector<int>> dp(m, vector<int>(n, 0));

    for (int i = 0; i < m; i++) {
      for (int j = 0; j < n; j++) {
        if (i == 0 && j == 0) dp[i][j] = grid[i][j];
        else if (i == 0) dp[i][j] = dp[i][j - 1] + grid[i][j];
        else if (j == 0) dp[i][j] = dp[i - 1][j] + grid[i][j];
        else {
          // 取上方和左方较小的代价
          dp[i][j] = min(dp[i - 1][j], dp[i][j - 1]) + grid[i][j];
        }
      }
    }
    return dp[m - 1][n - 1];
  }
};`,
        c: `// C
int minPathSum(int** grid, int gridSize, int* gridColSize) {
  int m = gridSize, n = gridColSize[0];
  // dp[i][j]：到该点的最小路径和
  int** dp = (int**)malloc(sizeof(int*) * m);
  for (int i = 0; i < m; i++) dp[i] = (int*)calloc(n, sizeof(int));

  for (int i = 0; i < m; i++) {
    for (int j = 0; j < n; j++) {
      if (i == 0 && j == 0) dp[i][j] = grid[i][j];
      else if (i == 0) dp[i][j] = dp[i][j - 1] + grid[i][j];
      else if (j == 0) dp[i][j] = dp[i - 1][j] + grid[i][j];
      else {
        // 普通格子：从上/左最优值转移
        int best = dp[i - 1][j] < dp[i][j - 1] ? dp[i - 1][j] : dp[i][j - 1];
        dp[i][j] = best + grid[i][j];
      }
    }
  }

  int ans = dp[m - 1][n - 1];
  for (int i = 0; i < m; i++) free(dp[i]);
  free(dp);
  return ans;
}`
      };

      let params = { seed: 64001, speed: 1.0, m: 4, n: 5 };
      let currentLang = "python";
      let grid = [];
      let dp = [];
      let m = 4;
      let n = 5;
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let i = 0;
      let j = 0;
      let stepInfo = null;

      function makeRng(seed) {
        let x = (seed >>> 0) || 1;
        return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296);
      }

      function parsePreset(raw) {
        try {
          const rows = raw.split(";").map((row) => row.split(",").map((x) => parseInt(x.trim(), 10)));
          if (!rows.length || !rows[0].length) return null;
          const cols = rows[0].length;
          for (const row of rows) {
            if (row.length !== cols || row.some((x) => Number.isNaN(x) || x <= 0)) return null;
          }
          return rows;
        } catch {
          return null;
        }
      }

      function generateGrid(mm, nn, seed) {
        const rnd = makeRng(seed);
        return Array.from({ length: mm }, () => Array.from({ length: nn }, () => 1 + Math.floor(rnd() * 9)));
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => {
          resizeCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        });
        switchLang("python");
      }

      function initializeSystem() {
        let presetGrid = null;
        if (presetRaw) presetGrid = parsePreset(presetRaw);
        if (presetGrid) {
          grid = presetGrid;
          m = grid.length;
          n = grid[0].length;
        } else {
          m = Math.max(2, Math.min(7, params.m | 0));
          n = Math.max(2, Math.min(7, params.n | 0));
          grid = generateGrid(m, n, params.seed);
        }

        params.m = m;
        params.n = n;
        document.getElementById("m").value = String(m);
        document.getElementById("n").value = String(n);
        document.getElementById("m-value").textContent = String(m);
        document.getElementById("n-value").textContent = String(n);

        dp = Array.from({ length: m }, () => Array(n).fill(0));
        isDone = false;
        isPaused = false;
        timer = 0;
        i = 0;
        j = 0;
        stepInfo = null;

        document.getElementById("log-container").innerHTML = "";
        updateDataNodes();
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`初始化 ${m}x${n} 网格，开始填 dp。`, true);
      }

      function draw() {
        background(255);
        drawGrid();
        drawStatus();
        if (isPaused || isDone) return;

        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 0.85) {
          performStep();
          timer = 0;
        }
      }

      function drawGrid() {
        const maxW = width - 80;
        const maxH = height - 220;
        const cell = Math.floor(Math.min(maxW / n, maxH / m));
        const gridW = cell * n;
        const gridH = cell * m;
        const sx = (width - gridW) / 2;
        const sy = 90;

        fill(90);
        noStroke();
        textSize(13);
        textAlign(LEFT, CENTER);
        text("单元显示：左上=grid 值，中央=dp 值", 24, 58);

        for (let r = 0; r < m; r++) {
          for (let c = 0; c < n; c++) {
            const x = sx + c * cell;
            const y = sy + r * cell;
            const isCur = !isDone && r === i && c === j;
            const isFromTop = stepInfo && stepInfo.fromTop && stepInfo.fromTop.r === r && stepInfo.fromTop.c === c;
            const isFromLeft = stepInfo && stepInfo.fromLeft && stepInfo.fromLeft.r === r && stepInfo.fromLeft.c === c;

            let fillColor = "#fff";
            let strokeColor = "#ddd";
            if (dp[r][c] > 0) {
              fillColor = "#eef3ff";
              strokeColor = "#6a9bcc";
            }
            if (isFromTop || isFromLeft) {
              fillColor = "#f6fbef";
              strokeColor = "#788c5d";
            }
            if (isCur) {
              fillColor = "#fff3ee";
              strokeColor = "#d97757";
            }

            stroke(strokeColor);
            strokeWeight(isCur || isFromTop || isFromLeft ? 2.1 : 1.1);
            fill(fillColor);
            rect(x, y, cell, cell, 6);

            noStroke();
            fill("#999");
            textAlign(LEFT, TOP);
            textSize(Math.max(9, Math.min(12, cell * 0.2)));
            text(grid[r][c], x + 6, y + 4);

            fill("#222");
            textAlign(CENTER, CENTER);
            textSize(Math.max(10, Math.min(14, cell * 0.24)));
            text(dp[r][c], x + cell / 2, y + cell / 2 + 4);
          }
        }
      }

      function drawStatus() {
        const bw = Math.min(540, width - 48);
        const bh = 162;
        const bx = (width - bw) / 2;
        const by = height - bh - 16;

        fill("#fffcf9");
        stroke("#e8e6dc");
        strokeWeight(1.4);
        rect(bx, by, bw, bh, 10);
        noStroke();

        fill("#666");
        textAlign(CENTER, CENTER);
        textSize(12);
        text(`i=${Math.min(i, m - 1)}  j=${Math.min(j, n - 1)}  当前答案=${dp[m - 1][n - 1]}`, bx + bw / 2, by + 22);

        textAlign(LEFT, CENTER);
        textSize(14);
        if (stepInfo) {
          fill("#6a9bcc");
          text(`处理 (${stepInfo.i}, ${stepInfo.j})，grid=${stepInfo.g}`, bx + 20, by + 56);
          fill("#d97757");
          text(stepInfo.detail1, bx + 20, by + 88);
          fill("#788c5d");
          text(stepInfo.detail2, bx + 20, by + 120);
        } else {
          fill("#777");
          text("等待首个状态更新...", bx + 20, by + 88);
        }
      }

      function performStep() {
        if (i >= m) {
          isDone = true;
          updateResult(`最终结果：${dp[m - 1][n - 1]}`, "var(--green)");
          logMsg(`填表完成，最小路径和 = ${dp[m - 1][n - 1]}。`, true, "success");
          return;
        }

        const g = grid[i][j];
        let fromTop = null;
        let fromLeft = null;
        let detail1 = "";
        let detail2 = "";

        if (i === 0 && j === 0) {
          dp[i][j] = g;
          detail1 = "起点直接取自身权重。";
          detail2 = `dp[0][0] = ${g}`;
        } else if (i === 0) {
          fromLeft = { r: i, c: j - 1 };
          dp[i][j] = dp[i][j - 1] + g;
          detail1 = `第一行只能从左来：dp[${i}][${j - 1}] + ${g}`;
          detail2 = `dp[${i}][${j}] = ${dp[i][j]}`;
        } else if (j === 0) {
          fromTop = { r: i - 1, c: j };
          dp[i][j] = dp[i - 1][j] + g;
          detail1 = `第一列只能从上来：dp[${i - 1}][${j}] + ${g}`;
          detail2 = `dp[${i}][${j}] = ${dp[i][j]}`;
        } else {
          fromTop = { r: i - 1, c: j };
          fromLeft = { r: i, c: j - 1 };
          const up = dp[i - 1][j];
          const left = dp[i][j - 1];
          const best = up < left ? up : left;
          dp[i][j] = best + g;
          detail1 = `min(上=${up}, 左=${left}) + ${g}`;
          detail2 = `dp[${i}][${j}] = ${dp[i][j]}`;
        }

        stepInfo = { i, j, g, fromTop, fromLeft, detail1, detail2 };
        logMsg(`(${i},${j}) -> dp=${dp[i][j]}`, true);

        j++;
        if (j >= n) {
          j = 0;
          i++;
        }

        if (i >= m) {
          isDone = true;
          updateResult(`最终结果：${dp[m - 1][n - 1]}`, "var(--green)");
          logMsg(`状态计算完成，答案为 ${dp[m - 1][n - 1]}。`, true, "success");
        }
      }

      function updateDataNodes() {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        [`m=${m}`, `n=${n}`, `终点=(${m - 1},${n - 1})`].forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          c.appendChild(node);
        });
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");

        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 64001;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function setPreset(raw) {
        presetRaw = raw;
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
