    python: `# Python
import heapq

class MedianFinder:
    def __init__(self):
        # max_heap 存储数据流中较小的一半。Python 原生只有小顶堆，所以存入负数来模拟大顶堆
        self.max_heap = []
        # min_heap 存储数据流中较大的一半（标准小顶堆）
        self.min_heap = []

    def addNum(self, num: int) -> None:
        # 1. 无论如何，新来的数字先丢进大顶堆（存入负数模拟）
        heapq.heappush(self.max_heap, -num)
        
        # 2. 将大顶堆中最大的元素弹出，丢给小顶堆
        # 这一步过滤能保证：小顶堆里的所有数字，都绝对大于大顶堆里的所有数字
        heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))
        
        # 3. 维护数量平衡：我们约定 max_heap 的元素个数要么和 min_heap 相等，要么多 1 个
        if len(self.min_heap) > len(self.max_heap):
            # 如果小顶堆数量反超了，就把小顶堆最小的元素还给大顶堆
            heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))

    def findMedian(self) -> float:
        # 如果总数是奇数，因为 max_heap 容纳了多出来的那 1 个，所以它的堆顶就是中位数
        if len(self.max_heap) > len(self.min_heap):
            return -self.max_heap[0]
        # 如果总数是偶数，中位数就是两边堆顶的平均值
        return (-self.max_heap[0] + self.min_heap[0]) / 2.0`,

    ts: `// TypeScript
class MedianFinder {
    // maxHeap 存储数据流中较小的一半（大顶堆）
    private maxHeap: MaxPriorityQueue<number>;
    // minHeap 存储数据流中较大的一半（小顶堆）
    private minHeap: MinPriorityQueue<number>;

    constructor() {
        this.maxHeap = new MaxPriorityQueue<number>();
        this.minHeap = new MinPriorityQueue<number>();
    }

    addNum(num: number): void {
        // 1. 新数字先放入大顶堆
        this.maxHeap.enqueue(num);
        
        // 2. 弹出大顶堆的最大值放入小顶堆
        // 确保 minHeap 中的所有元素始终大于或等于 maxHeap 中的元素
        this.minHeap.enqueue(this.maxHeap.dequeue());
        
        // 3. 维护两边平衡：约定 maxHeap 的大小可以比 minHeap 多 1，但不能少
        if (this.minHeap.size() > this.maxHeap.size()) {
            this.maxHeap.enqueue(this.minHeap.dequeue());
        }
    }

    findMedian(): number {
        // 元素总数为奇数时，中位数即为 maxHeap 的堆顶
        if (this.maxHeap.size() > this.minHeap.size()) {
            return this.maxHeap.front();
        }
        // 元素总数为偶数时，中位数是两个堆顶的平均值
        return (this.maxHeap.front() + this.minHeap.front()) / 2.0;
    }
}`,

    java: `// Java
class MedianFinder {
    // maxHeap 存储较小的一半，使用 Lambda 表达式翻转默认比较规则，变为大顶堆
    private PriorityQueue<Integer> maxHeap;
    // minHeap 存储较大的一半，Java 默认就是小顶堆
    private PriorityQueue<Integer> minHeap;

    public MedianFinder() {
        maxHeap = new PriorityQueue<>((a, b) -> b - a);
        minHeap = new PriorityQueue<>();
    }
    
    public void addNum(int num) {
        // 1. 先加入大顶堆
        maxHeap.add(num);
        // 2. 将大顶堆的最大值过滤到小顶堆，确保两堆之间的大小关系严格划分
        minHeap.add(maxHeap.poll());
        
        // 3. 维护容量平衡，保证大顶堆的数量 >= 小顶堆的数量
        if (minHeap.size() > maxHeap.size()) {
            maxHeap.add(minHeap.poll());
        }
    }
    
    public double findMedian() {
        // 奇数情况：大顶堆多存了一个，直接返回大顶堆的堆顶
        if (maxHeap.size() > minHeap.size()) {
            return maxHeap.peek();
        }
        // 偶数情况：两边各取堆顶，求平均值
        return (maxHeap.peek() + minHeap.peek()) / 2.0;
    }
}`,

    cpp: `// C++
class MedianFinder {
    // maxHeap 存储较小的一半。C++ 的 priority_queue 默认就是大顶堆
    priority_queue<int> maxHeap; 
    // minHeap 存储较大的一半。需要手动指定底层容器和比较器(greater)来实现小顶堆
    priority_queue<int, vector<int>, greater<int>> minHeap; 
public:
    MedianFinder() {}
    
    void addNum(int num) {
        // 1. 入大顶堆
        maxHeap.push(num);
        
        // 2. 倒腾一下：把大顶堆的最大元素塞给小顶堆
        minHeap.push(maxHeap.top());
        maxHeap.pop();
        
        // 3. 平衡数量：强制要求 maxHeap 数量 >= minHeap
        if (minHeap.size() > maxHeap.size()) {
            maxHeap.push(minHeap.top());
            minHeap.pop();
        }
    }
    
    double findMedian() {
        // 奇数个元素，直接返回 maxHeap 的最大值
        if (maxHeap.size() > minHeap.size()) {
            return maxHeap.top();
        }
        // 偶数个元素，两堆顶相加除以 2.0 获取浮点数平均值
        return (maxHeap.top() + minHeap.top()) / 2.0;
    }
};`,

    c: `// C\n// C 语言原生无优先队列，需要手动使用数组构建并实现向上/向下调整(bubbleUp/sinkDown)函数。\n// 核心逻辑同样是维护一个大顶堆和一个小顶堆，并在 addNum 时互相倒腾元素以保证数量平衡。`
};

      class MinHeap {
          constructor() { this.heap = []; }
          push(val) { this.heap.push(val); this.bubbleUp(this.heap.length - 1); }
          pop() {
              if (this.heap.length === 0) return null;
              if (this.heap.length === 1) return this.heap.pop();
              const root = this.heap[0];
              this.heap[0] = this.heap.pop();
              this.bubbleDown(0);
              return root;
          }
          peek() { return this.heap[0]; }
          size() { return this.heap.length; }
          toArray() { return [...this.heap]; }
          bubbleUp(i) {
              while (i > 0) {
                  let p = Math.floor((i - 1) / 2);
                  if (this.heap[i] < this.heap[p]) {
                      [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
                      i = p;
                  } else break;
              }
          }
          bubbleDown(i) {
              while (true) {
                  let left = 2 * i + 1, right = 2 * i + 2, min = i;
                  if (left < this.heap.length && this.heap[left] < this.heap[min]) min = left;
                  if (right < this.heap.length && this.heap[right] < this.heap[min]) min = right;
                  if (min !== i) {
                      [this.heap[i], this.heap[min]] = [this.heap[min], this.heap[i]];
                      i = min;
                  } else break;
              }
          }
      }

      class MaxHeap {
          constructor() { this.heap = []; }
          push(val) { this.heap.push(val); this.bubbleUp(this.heap.length - 1); }
          pop() {
              if (this.heap.length === 0) return null;
              if (this.heap.length === 1) return this.heap.pop();
              const root = this.heap[0];
              this.heap[0] = this.heap.pop();
              this.bubbleDown(0);
              return root;
          }
          peek() { return this.heap[0]; }
          size() { return this.heap.length; }
          toArray() { return [...this.heap]; }
          bubbleUp(i) {
              while (i > 0) {
                  let p = Math.floor((i - 1) / 2);
                  if (this.heap[i] > this.heap[p]) {
                      [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
                      i = p;
                  } else break;
              }
          }
          bubbleDown(i) {
              while (true) {
                  let left = 2 * i + 1, right = 2 * i + 2, max = i;
                  if (left < this.heap.length && this.heap[left] > this.heap[max]) max = left;
                  if (right < this.heap.length && this.heap[right] > this.heap[max]) max = right;
                  if (max !== i) {
                      [this.heap[i], this.heap[max]] = [this.heap[max], this.heap[i]];
                      i = max;
                  } else break;
              }
          }
      }

      let params = { speed: 1.0 };
      let isDone = false, isPaused = false, p5Timer = 0;
      let currentLang = "python";

      let NUMS = [5, 15, 1, 3, 2, 8, 7];
      
      let state = null;

      function setup() {
        let container = document.getElementById("canvas-container");
        let canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);

      function* dualHeapGen() {
          let maxH = new MaxHeap();
          let minH = new MinHeap();
          let stream = [];
          
          yield { phase: "START", maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: "准备就绪，双堆机制（天平）初始化完毕。" };
          
          for(let i=0; i<NUMS.length; i++){
              let num = NUMS[i];
              stream.push(num);
              yield { phase: "READ", num, maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `【接收数据】: 新增数字 <b>${num}</b>` };
              
              // 1. Add to MaxHeap
              maxH.push(num);
              yield { phase: "PUSH_MAX", num, maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>步骤 1</b>：无脑放入 <b>大顶堆 (左)</b>` };
              
              // 2. Pop MaxHeap, push to MinHeap
              let maxTop = maxH.pop();
              minH.push(maxTop);
              yield { phase: "TRANSFER_TO_MIN", transferred: maxTop, maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>步骤 2</b>：大顶堆弹出最大的 <b>${maxTop}</b>，转移给 <b>小顶堆 (右)</b>` };
              
              // 3. Rebalance
              if (minH.size() > maxH.size()) {
                  let minTop = minH.pop();
                  maxH.push(minTop);
                  yield { phase: "REBALANCE", transferred: minTop, maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>步骤 3</b>：右侧人数 > 左侧！小顶堆弹出最小的 <b>${minTop}</b> 还给左侧，维持平衡` };
              } else {
                  yield { phase: "NO_REBALANCE", maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>步骤 3</b>：右侧人数 <= 左侧，满足平衡条件，跳过` };
              }
              
              // 4. Find Median
              let median = 0;
              if (maxH.size() > minH.size()) {
                  median = maxH.peek();
                  yield { phase: "MEDIAN", type: "ODD", median, maxTop: maxH.peek(), maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>求中位数</b>：总数为奇数，答案是左侧堆顶 = <b>${median}</b>` };
              } else {
                  median = (maxH.peek() + minH.peek()) / 2.0;
                  yield { phase: "MEDIAN", type: "EVEN", median, maxTop: maxH.peek(), minTop: minH.peek(), maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: `<b>求中位数</b>：总数为偶数，答案是 (左侧 ${maxH.peek()} + 右侧 ${minH.peek()}) / 2 = <b>${median}</b>` };
              }
          }
          
          yield { phase: "DONE", maxH: maxH.toArray(), minH: minH.toArray(), stream: [...stream], msg: "所有数据流处理完毕！" };
      }

      function initializeSystem() {
        isDone = false;
        isPaused = false;
        p5Timer = 0;
        state = null;

        gen = dualHeapGen();
        state = gen.next().value;

        let btn = document.getElementById("pause-btn");
        if (btn) { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--anthropic-dark)"; }
        document.getElementById("log-container").innerHTML = "";
        
        let headerEl = document.getElementById("phase-header");
        if (headerEl) headerEl.innerHTML = `▶ 数据流处理中...`;
        logMsg(`✅ 模拟数据流: [${NUMS.join(", ")}]`, true);
      }

      function setPreset(arr) {
          NUMS = arr;
          initializeSystem();
      }

      function drawVisuals() {
          let s = state;
          if (!s) return;
          
          let w = width;
          let h = height;
          
          // 1. Stream Area
          let streamY = 60;
          fill(150); noStroke(); textAlign(LEFT, BOTTOM); textSize(14); textStyle(BOLD);
          text("数据流 (Data Stream)", 40, streamY - 20);
          textStyle(NORMAL);
          
          let boxW = 40;
          for (let k = 0; k < NUMS.length; k++) {
              let bx = 40 + k * 45 + boxW/2;
              let isCurrent = (s.num !== undefined && s.num === NUMS[k] && s.stream.includes(NUMS[k])); // rough check
              // accurate check:
              isCurrent = false;
              if (s.phase !== "DONE" && s.phase !== "START") {
                  if (k === s.stream.length - 1) isCurrent = true;
              }
              let isProcessed = k < s.stream.length;
              
              if (isCurrent) { fill(254, 215, 170); stroke(234, 88, 12); strokeWeight(2); }
              else if (isProcessed) { fill(245); stroke(220); strokeWeight(1); }
              else { fill(255); stroke(200); strokeWeight(1); }
              
              rect(bx - boxW/2, streamY, boxW, boxW, 6);
              
              fill(isProcessed && !isCurrent ? 150 : 50); noStroke(); textAlign(CENTER, CENTER); textSize(16); textStyle(BOLD);
              text(NUMS[k], bx, streamY + boxW/2);
              textStyle(NORMAL);
          }
          
          // 2. Dual Heaps
          let heapYBase = 220;
          let maxHeapX = w / 4;
          let minHeapX = w * 3 / 4;
          
          // Labels
          fill(220, 38, 38); noStroke(); textAlign(CENTER, BOTTOM); textSize(16); textStyle(BOLD);
          text("大顶堆 Max-Heap", maxHeapX, heapYBase - 40);
          fill(150); textSize(12); textStyle(NORMAL);
          text("存储数据较小的一半\n(堆顶是这半边里最大的)", maxHeapX, heapYBase - 10);
          
          fill(34, 197, 94); noStroke(); textAlign(CENTER, BOTTOM); textSize(16); textStyle(BOLD);
          text("小顶堆 Min-Heap", minHeapX, heapYBase - 40);
          fill(150); textSize(12); textStyle(NORMAL);
          text("存储数据较大的一半\n(堆顶是这半边里最小的)", minHeapX, heapYBase - 10);
          
          // Scales / Balance line
          stroke(220); strokeWeight(2);
          drawingContext.setLineDash([5, 5]);
          line(w/2, heapYBase - 60, w/2, height - 100);
          drawingContext.setLineDash([]);
          
          // Draw trees
          drawTree(s.maxH, maxHeapX, heapYBase + 20, "MAX", s);
          drawTree(s.minH, minHeapX, heapYBase + 20, "MIN", s);
          
          // Draw Transfer Animation (Floating node)
          if (s.phase === "TRANSFER_TO_MIN") {
              drawFloatingNode(s.transferred, maxHeapX, heapYBase + 20, minHeapX, heapYBase + 20, 249, 115, 22);
          } else if (s.phase === "REBALANCE") {
              drawFloatingNode(s.transferred, minHeapX, heapYBase + 20, maxHeapX, heapYBase + 20, 56, 189, 248);
          }
          
          // 3. Median Result Box
          if (s.phase.startsWith("MEDIAN") || s.phase === "DONE") {
              let resY = height - 80;
              fill(254, 240, 138); stroke(202, 138, 4); strokeWeight(2);
              rect(w/2 - 120, resY, 240, 50, 8);
              fill(161, 98, 7); noStroke(); textAlign(CENTER, CENTER); textSize(18); textStyle(BOLD);
              if (s.phase === "DONE") {
                  text(`处理完成！`, w/2, resY + 25);
              } else {
                  text(`当前中位数 = ${s.median}`, w/2, resY + 25);
              }
              textStyle(NORMAL);
              
              // Draw arrows from heap tops to median box if applicable
              if (s.phase === "MEDIAN") {
                  stroke(202, 138, 4); strokeWeight(2);
                  if (s.type === "ODD") {
                      line(maxHeapX, heapYBase + 20 + 20, w/2 - 60, resY);
                  } else {
                      line(maxHeapX, heapYBase + 20 + 20, w/2 - 60, resY);
                      line(minHeapX, heapYBase + 20 + 20, w/2 + 60, resY);
                  }
              }
          }
      }
      
      function drawFloatingNode(val, fromX, fromY, toX, toY, r, g, b) {
          // A simple static representation in the middle to simulate transfer
          let cx = (fromX + toX) / 2;
          let cy = (fromY + toY) / 2 - 40;
          
          // Draw curved arrow
          stroke(r, g, b, 150); strokeWeight(3); noFill();
          bezier(fromX, fromY, fromX, cy, toX, cy, toX, toY);
          
          fill(255); stroke(r, g, b); strokeWeight(2);
          ellipse(cx, cy, 40, 40);
          fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(16); textStyle(BOLD);
          text(val, cx, cy);
          textStyle(NORMAL);
      }
      
      function drawTree(heap, startX, startY, type, s) {
          if (!heap || heap.length === 0) {
              fill(230); noStroke(); textAlign(CENTER, CENTER); textSize(14);
              text("( 空 )", startX, startY + 20);
              return;
          }
          
          let pos = [];
          let levelHeight = 60;
          let nodeRadius = 18; // 36 diameter
          
          for (let i = 0; i < heap.length; i++) {
              let level = Math.floor(Math.log2(i + 1));
              let levelNodes = Math.pow(2, level);
              let indexInLevel = i - (levelNodes - 1);
              
              let spread = 80 / Math.max(1, level);
              let xOffset = 0;
              if (levelNodes > 1) {
                  xOffset = -spread * (levelNodes - 1) / 2 + indexInLevel * spread;
              }
              
              pos.push({x: startX + xOffset, y: startY + level * levelHeight});
          }
          
          // Edges
          stroke(200); strokeWeight(2);
          for (let i = 1; i < heap.length; i++) {
              let parent = Math.floor((i - 1) / 2);
              line(pos[parent].x, pos[parent].y, pos[i].x, pos[i].y);
          }
          
          // Nodes
          for (let i = 0; i < heap.length; i++) {
              let isHighlight = false;
              let isTopHighlight = false;
              
              if (s.phase === "PUSH_MAX" && type === "MAX" && heap[i] === s.num) isHighlight = true;
              if (s.phase === "REBALANCE" && type === "MAX" && heap[i] === s.transferred) isHighlight = true;
              
              if (s.phase === "MEDIAN") {
                  if (s.type === "ODD" && type === "MAX" && i === 0) isTopHighlight = true;
                  if (s.type === "EVEN" && i === 0) isTopHighlight = true;
              }
              
              if (isTopHighlight) {
                  fill(254, 240, 138); stroke(202, 138, 4);
              } else if (isHighlight) {
                  fill(224, 242, 254); stroke(56, 189, 248);
              } else {
                  if (type === "MAX") { fill(254, 242, 242); stroke(239, 68, 68); }
                  else { fill(240, 253, 244); stroke(34, 197, 94); }
              }
              
              strokeWeight(2);
              ellipse(pos[i].x, pos[i].y, nodeRadius * 2, nodeRadius * 2);
              
              fill(50); noStroke(); textAlign(CENTER, CENTER); textSize(15); textStyle(BOLD);
              text(heap[i], pos[i].x, pos[i].y);
              textStyle(NORMAL);
          }
      }

      function draw() {
        background(255);
        if (state) drawVisuals();

        if (!isDone && !isPaused) {
          p5Timer += 0.015 * params.speed;
          let waitLimit = 1.0;
          if (state && state.phase === "READ") waitLimit = 0.5;
          if (state && (state.phase === "TRANSFER_TO_MIN" || state.phase === "REBALANCE")) waitLimit = 1.5;
          if (state && state.phase.startsWith("MEDIAN")) waitLimit = 1.5;
          
          if (p5Timer > waitLimit) {
            p5Timer = 0;
            performStep();
          }
        }
      }

      function performStep() {
        let nxt = gen.next();
        if (nxt.done) {
            if (!isDone) isDone = true;
            return;
        }

        state = nxt.value;
        let s = state;

        if (s.phase === "START") {
            logMsg(s.msg, false);
        } else if (s.phase === "READ") {
            logMsg(`\n------------------\n👀 ${s.msg}`, false);
        } else if (s.phase === "PUSH_MAX") {
            logMsg(`📥 ${s.msg}`, false);
        } else if (s.phase === "TRANSFER_TO_MIN") {
            logMsg(`➡️ ${s.msg}`, true);
        } else if (s.phase === "REBALANCE") {
            logMsg(`⬅️ ${s.msg}`, true);
        } else if (s.phase === "NO_REBALANCE") {
            logMsg(`⚖️ ${s.msg}`, false);
        } else if (s.phase.startsWith("MEDIAN")) {
            logMsg(`🎯 ${s.msg}`, true);
        } else if (s.phase === "DONE") {
            logMsg(`\n🎉 ${s.msg}`, true);
            let headerEl = document.getElementById("phase-header");
            if (headerEl) headerEl.innerHTML = "🏁 处理完成";
        }
      }

      function logMsg(msg, highlight = false) {
        let container = document.getElementById("log-container");
        if (!container) return;
        let item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "");
        let time = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="time">${time}</div><div style="font-family:'JetBrains Mono',monospace">${msg}</div>`;
        container.appendChild(item);
        container.scrollTop = container.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        const tabs = document.querySelectorAll(".tab");
        const langMap = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        tabs[langMap[lang]].classList.add("active");

        const codeEl = document.getElementById("code-viewer");
        const hljsMap = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hljsMap[lang];
        codeEl.textContent = SNIPPETS[lang];

        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        let display = document.getElementById(id + "-value");
        if (display) display.textContent = val;
      }

      function togglePause() {
        isPaused = !isPaused;
        let btn = document.getElementById("pause-btn");
        if (!btn) return;
        if (isPaused) { btn.innerHTML = "▶ 继续"; btn.style.background = "var(--anthropic-green)"; }
        else { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--anthropic-dark)"; }
      }
    </script>
  </body>
