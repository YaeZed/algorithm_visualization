    <style>
      :root { --dark:#141413; --line:#e8e6dc; --mid:#b0aea5; --orange:#d97757; --blue:#6a9bcc; --green:#788c5d; }

      .container { display:flex; height:100vh; padding:15px; gap:15px; }

      .button { width:100%; border:none; background:var(--orange); color:#fff; border-radius:6px; padding:10px; font-size:13px; font-weight:500; cursor:pointer; }
      .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
      .preset { border:1px solid var(--line); border-radius:6px; padding:7px 6px; background:#fff; font-family:"JetBrains Mono",monospace; font-size:11px; cursor:pointer; text-align:center; }
      .canvas-area { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
      .canvas-header { padding:10px 20px; border-bottom:1px solid var(--line); font-size:13px; color:#888; display:flex; justify-content:space-between; }
      #canvas-container { flex:1; width:100%; height:100%; }
      .right-panel { flex:1; min-width:0; display:flex; flex-direction:column; gap:15px; }
      .code-box { flex:1.08; background:#1e1e1e; border:1px solid #333; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
      .box-header.dark { background:#282828; border-bottom:1px solid #1e1e1e; padding:10px 15px 0; display:flex; justify-content:space-between; align-items:center; }
      .box-title.dark { color:#ccc; font-size:12px; font-weight:600; padding-bottom:10px; }
      .tabs.dark { display:flex; gap:1px; align-items:flex-end; }
      .tabs.dark .tab { padding:8px 16px; background:#2d2d2d; color:#888; border-radius:6px 6px 0 0; font-size:11px; cursor:pointer; }
      .tabs.dark .tab.active { background:#1e1e1e; color:#4ec9b0; border-top:2px solid #007acc; }

      .data-array { display:flex; flex-wrap:wrap; gap:5px; min-height:30px; }

      .memo-card h3 { font-size:12px; font-weight:600; margin-bottom:10px; }
      .memo-badges { display:flex; gap:6px; margin-bottom:10px; }

      .memo-time { background:#fff3ee; color:var(--orange); border:1px solid #f0c8b0; }
      .memo-space { background:#eef3ff; color:var(--blue); border:1px solid #b8d0f0; }
      .memo-tip { padding:6px 9px; font-size:11px; line-height:1.5; color:#555; background:#fffcf9; border-left:3px solid var(--orange); border-radius:0 5px 5px 0; margin-bottom:6px; }
      .memo-tip.g { border-left-color:var(--green); }
      .memo-tip.w { border-left-color:#e8a838; background:#fffdf2; }
      ::-webkit-scrollbar { width:6px; }
      ::-webkit-scrollbar-thumb { background:#e0e0e0; border-radius:3px; }

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>编辑距离</h1>
        <div class="subtitle">LeetCode 72 · 二维 DP</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="72001" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">随机生成字符串对</button>
        </div>
        <div class="control-section">
          <h3>参数控制</h3>
          <div class="control-group">
            <label>动画速度</label>
            <div class="slider-container">
              <input type="range" id="speed" min="0.1" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)" />
              <span class="value-display" id="speed-value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>长度（随机）</label>
            <div class="slider-container">
              <input type="range" id="n" min="4" max="9" step="1" value="6" oninput="updateParam('n', this.value)" />
              <span class="value-display" id="n-value">6</span>
            </div>
          </div>
          <div class="control-group">
            <label>预设样例</label>
            <div class="preset-grid">
              <button class="preset" onclick="setPreset('horse|ros')">horse/ros</button>
              <button class="preset" onclick="setPreset('intention|execution')">in/ex</button>
              <button class="preset" onclick="setPreset('kitten|sitting')">kit/sit</button>
              <button class="preset" onclick="setPreset('abc|abc')">abc/abc</button>
            </div>
          </div>
        </div>
        <div class="control-section" style="display:flex; gap:10px">
          <button id="pause-btn" class="button" style="background:var(--dark)" onclick="togglePause()">⏸ 暂停</button>
          <button class="button" style="background:var(--blue)" onclick="resetAnimation()">🔄 重新运行</button>
        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(m*n)</span>
            <span class="memo-badge memo-space">空间 O(m*n)</span>
          </div>
          <div class="memo-tip">dp[i][j] 表示 word1 前 i 个转成 word2 前 j 个的最少操作数。</div>
          <div class="memo-tip g">若字符相同：dp[i][j]=dp[i-1][j-1]。</div>
          <div class="memo-tip w">否则：min(替换, 删除, 插入)+1。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>编辑距离 DP 填表</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">输入字符串</div>
            <div id="data-nodes" class="data-array"></div>
          </div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def minDistance(word1: str, word2: str) -> int:
    m, n = len(word1), len(word2)
    # dp[i][j]：word1[:i] 到 word2[:j] 的最少操作数
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i - 1] == word2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                replace = dp[i - 1][j - 1]
                delete = dp[i - 1][j]
                insert = dp[i][j - 1]
                dp[i][j] = min(replace, delete, insert) + 1
    return dp[m][n]`,
        ts: `// TypeScript
function minDistance(word1: string, word2: string): number {
  const m = word1.length, n = word2.length;
  // dp[i][j]：前缀转换最少操作数
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (word1[i - 1] === word2[j - 1]) dp[i][j] = dp[i - 1][j - 1];
      else {
        const replace = dp[i - 1][j - 1];
        const del = dp[i - 1][j];
        const ins = dp[i][j - 1];
        dp[i][j] = Math.min(replace, del, ins) + 1;
      }
    }
  }
  return dp[m][n];
}`,
        java: `// Java
class Solution {
  public int minDistance(String word1, String word2) {
    int m = word1.length(), n = word2.length();
    // dp[i][j]：前缀编辑距离
    int[][] dp = new int[m + 1][n + 1];
    for (int i = 0; i <= m; i++) dp[i][0] = i;
    for (int j = 0; j <= n; j++) dp[0][j] = j;

    for (int i = 1; i <= m; i++) {
      for (int j = 1; j <= n; j++) {
        if (word1.charAt(i - 1) == word2.charAt(j - 1)) dp[i][j] = dp[i - 1][j - 1];
        else {
          int replace = dp[i - 1][j - 1], del = dp[i - 1][j], ins = dp[i][j - 1];
          dp[i][j] = Math.min(replace, Math.min(del, ins)) + 1;
        }
      }
    }
    return dp[m][n];
  }
}`,
        cpp: `// C++
class Solution {
public:
  int minDistance(string word1, string word2) {
    int m = (int)word1.size(), n = (int)word2.size();
    // dp[i][j]：前缀编辑距离
    vector<vector<int>> dp(m + 1, vector<int>(n + 1, 0));
    for (int i = 0; i <= m; i++) dp[i][0] = i;
    for (int j = 0; j <= n; j++) dp[0][j] = j;

    for (int i = 1; i <= m; i++) {
      for (int j = 1; j <= n; j++) {
        if (word1[i - 1] == word2[j - 1]) dp[i][j] = dp[i - 1][j - 1];
        else dp[i][j] = min({dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]}) + 1;
      }
    }
    return dp[m][n];
  }
};`,
        c: `// C
int minDistance(char* word1, char* word2) {
  int m = (int)strlen(word1), n = (int)strlen(word2);
  // dp[i][j]：前缀编辑距离
  int** dp = (int**)malloc(sizeof(int*) * (m + 1));
  for (int i = 0; i <= m; i++) dp[i] = (int*)calloc(n + 1, sizeof(int));
  for (int i = 0; i <= m; i++) dp[i][0] = i;
  for (int j = 0; j <= n; j++) dp[0][j] = j;

  for (int i = 1; i <= m; i++) {
    for (int j = 1; j <= n; j++) {
      if (word1[i - 1] == word2[j - 1]) dp[i][j] = dp[i - 1][j - 1];
      else {
        int rep = dp[i - 1][j - 1], del = dp[i - 1][j], ins = dp[i][j - 1];
        int best = rep < del ? rep : del;
        if (ins < best) best = ins;
        dp[i][j] = best + 1;
      }
    }
  }
  int ans = dp[m][n];
  for (int i = 0; i <= m; i++) free(dp[i]);
  free(dp);
  return ans;
}`
      };

      let params = { seed: 72001, speed: 1.0, n: 6 };
      let currentLang = "python";
      let a = "";
      let b = "";
      let dp = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let i = 0;
      let j = 0;
      let stepInfo = null;

      function makeRng(seed) { let x = (seed >>> 0) || 1; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
      function genStr(n, seed) {
        const chars = "abcde";
        const rnd = makeRng(seed);
        let out = "";
        for (let k = 0; k < n; k++) out += chars[Math.floor(rnd() * chars.length)];
        return out;
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth || 500, container.offsetHeight || 600));
        switchLang("python");
      }

      function initializeSystem() {
        if (presetRaw) {
          const parts = presetRaw.split("|");
          a = (parts[0] || "").trim();
          b = (parts[1] || "").trim();
        } else {
          a = genStr(params.n, params.seed);
          b = genStr(params.n, params.seed + 333);
        }
        if (a.length < 1) a = "horse";
        if (b.length < 1) b = "ros";
        dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let x = 0; x <= a.length; x++) dp[x][0] = x;
        for (let y = 0; y <= b.length; y++) dp[0][y] = y;
        isDone = false;
        isPaused = false;
        timer = 0;
        i = 1;
        j = 1;
        stepInfo = null;
        document.getElementById("log-container").innerHTML = "";
        updateDataNodes();
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`word1="${a}", word2="${b}"，初始化边界完成。`, true);
      }

      function draw() {
        background(255);
        drawMatrix();
        drawStatus();
        if (isPaused || isDone) return;
        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 0.85) {
          performStep();
          timer = 0;
        }
      }

      function drawMatrix() {
        const m = a.length, n = b.length;
        const rows = m + 1, cols = n + 1;
        const cell = Math.floor(Math.min((width - 140) / cols, (height - 290) / rows));
        const sx = (width - cell * cols) / 2;
        const sy = 95;
        fill(90); noStroke(); textSize(12); textAlign(LEFT, CENTER);
        text("dp[i][j]：word1[:i] -> word2[:j] 的最少操作数", 24, 60);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = sx + c * cell, y = sy + r * cell;
            let fc = "#fff", sc = "#ddd";
            if (dp[r][c] > 0) { fc = "#eef3ff"; sc = "#6a9bcc"; }
            if (!isDone && r === i && c === j) { fc = "#fff3ee"; sc = "#d97757"; }
            if (stepInfo && stepInfo.src && stepInfo.src.some((p) => p[0] === r && p[1] === c)) { fc = "#f6fbef"; sc = "#788c5d"; }
            stroke(sc); strokeWeight(1.1); fill(fc); rect(x, y, cell, cell, 4);
            noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(Math.max(9, cell * 0.25));
            text(dp[r][c], x + cell / 2, y + cell / 2);
          }
        }
        fill("#666"); textAlign(CENTER, CENTER); textSize(Math.max(10, Math.min(12, cell * 0.28)));
        for (let c = 1; c < cols; c++) text(b[c - 1], sx + c * cell + cell / 2, sy - 14);
        for (let r = 1; r < rows; r++) text(a[r - 1], sx - 14, sy + r * cell + cell / 2);
      }

      function drawStatus() {
        const bw = Math.min(560, width - 48), bh = 160;
        const bx = (width - bw) / 2, by = height - bh - 16;
        fill("#fffcf9"); stroke("#e8e6dc"); strokeWeight(1.4); rect(bx, by, bw, bh, 10); noStroke();
        fill("#666"); textAlign(CENTER, CENTER); textSize(12);
        text(`i=${Math.min(i, a.length)}  j=${Math.min(j, b.length)}  当前答案=${dp[a.length][b.length]}`, bx + bw / 2, by + 22);
        textAlign(LEFT, CENTER); textSize(14);
        if (stepInfo) {
          fill("#6a9bcc"); text(stepInfo.d1, bx + 20, by + 56);
          fill("#d97757"); text(stepInfo.d2, bx + 20, by + 90);
          fill("#788c5d"); text(stepInfo.d3, bx + 20, by + 124);
        } else {
          fill("#777"); text("等待首个状态更新...", bx + 20, by + 90);
        }
      }

      function performStep() {
        const m = a.length, n = b.length;
        if (i > m) {
          isDone = true;
          updateResult(`最终结果：${dp[m][n]}`, "var(--green)");
          logMsg(`填表结束，编辑距离 = ${dp[m][n]}。`, true, "success");
          return;
        }
        const ca = a[i - 1], cb = b[j - 1];
        let src = [];
        if (ca === cb) {
          dp[i][j] = dp[i - 1][j - 1];
          src = [[i - 1, j - 1]];
          stepInfo = { src, d1: `字符相同：'${ca}'`, d2: `dp[${i}][${j}] = dp[${i - 1}][${j - 1}]`, d3: `当前值 = ${dp[i][j]}` };
        } else {
          const rep = dp[i - 1][j - 1], del = dp[i - 1][j], ins = dp[i][j - 1];
          const best = Math.min(rep, del, ins);
          dp[i][j] = best + 1;
          if (best === rep) src.push([i - 1, j - 1]);
          if (best === del) src.push([i - 1, j]);
          if (best === ins) src.push([i, j - 1]);
          stepInfo = {
            src,
            d1: `字符不同：'${ca}' vs '${cb}'`,
            d2: `min(替换=${rep}, 删除=${del}, 插入=${ins}) + 1`,
            d3: `dp[${i}][${j}] = ${dp[i][j]}`
          };
        }
        logMsg(`i=${i}, j=${j}, dp=${dp[i][j]}`, true);
        j++;
        if (j > n) { j = 1; i++; }
      }

      function updateDataNodes() {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        [`W1:${a}`, `W2:${b}`].forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          c.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }
      function updateResult(text, color) { const el = document.getElementById("result-label"); el.textContent = text; el.style.color = color; }
      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");
        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }
      function updateParam(id, val) { if (id in params) params[id] = parseFloat(val); document.getElementById(id + "-value").textContent = val; }
      function updateSeed() { params.seed = parseInt(document.getElementById("seed-input").value, 10) || 72001; presetRaw = ""; initializeSystem(); }
      function randomSeedAndUpdate() { params.seed = floor(random(1, 99999)); document.getElementById("seed-input").value = params.seed; presetRaw = ""; initializeSystem(); }
      function setPreset(raw) { presetRaw = raw; initializeSystem(); }
      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) { btn.innerHTML = "▶ 继续"; btn.style.background = "var(--green)"; }
        else { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--dark)"; }
      }
      function resetAnimation() { initializeSystem(); }
    </script>
  </body>
</html>
