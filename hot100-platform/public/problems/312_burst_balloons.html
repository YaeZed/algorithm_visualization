  <body>
    <div class="container">
      <div class="sidebar">
        <h1>戳气球</h1>
        <div class="subtitle">LeetCode 312 · 区间 DP（最后戳）</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="31201" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">随机生成数组</button>

        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(n³)</span>
            <span class="memo-badge memo-space">空间 O(n²)</span>
          </div>
          <div class="memo-tip">在两端补 1，定义 dp[l][r] 表示开区间 (l,r) 内能得到的最大硬币数。</div>
          <div class="memo-tip g">枚举最后戳的气球 k：dp[l][r]=max(dp[l][k]+dp[k][r]+v[l]*v[k]*v[r])。</div>
          <div class="memo-tip w">按区间长度从小到大填表，确保子区间先计算完成。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>区间 DP 填表</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>

        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">原始数组</div>

          </div>
          <div id="log-container" class="log-area"></div>
        </div>

    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def maxCoins(nums: list[int]) -> int:
    vals = [1] + nums + [1]
    n = len(nums)
    # dp[l][r]：开区间 (l,r) 的最优值
    dp = [[0] * (n + 2) for _ in range(n + 2)]

    for gap in range(2, n + 2):       # r-l
        for l in range(0, n + 2 - gap):
            r = l + gap
            for k in range(l + 1, r):
                # k 作为最后戳破的气球
                cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r]
                dp[l][r] = max(dp[l][r], cand)
    return dp[0][n + 1]`,
        ts: `// TypeScript
function maxCoins(nums: number[]): number {
  const vals = [1, ...nums, 1];
  const n = nums.length;
  // dp[l][r]：开区间 (l,r) 的最优值
  const dp = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0));

  for (let gap = 2; gap <= n + 1; gap++) {
    for (let l = 0; l + gap <= n + 1; l++) {
      const r = l + gap;
      for (let k = l + 1; k < r; k++) {
        // 枚举最后戳的 k
        const cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r];
        if (cand > dp[l][r]) dp[l][r] = cand;
      }
    }
  }
  return dp[0][n + 1];
}`,
        java: `// Java
class Solution {
  public int maxCoins(int[] nums) {
    int n = nums.length;
    int[] vals = new int[n + 2];
    vals[0] = vals[n + 1] = 1;
    for (int i = 0; i < n; i++) vals[i + 1] = nums[i];
    // dp[l][r]：开区间 (l,r) 内的最优值
    int[][] dp = new int[n + 2][n + 2];

    for (int gap = 2; gap <= n + 1; gap++) {
      for (int l = 0; l + gap <= n + 1; l++) {
        int r = l + gap;
        for (int k = l + 1; k < r; k++) {
          // 以 k 为最后戳破位置
          int cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r];
          if (cand > dp[l][r]) dp[l][r] = cand;
        }
      }
    }
    return dp[0][n + 1];
  }
}`,
        cpp: `// C++
class Solution {
public:
  int maxCoins(vector<int>& nums) {
    int n = (int)nums.size();
    vector<int> vals(n + 2, 1);
    for (int i = 0; i < n; i++) vals[i + 1] = nums[i];
    // dp[l][r]：开区间 (l,r) 的最大得分
    vector<vector<int>> dp(n + 2, vector<int>(n + 2, 0));

    for (int gap = 2; gap <= n + 1; gap++) {
      for (int l = 0; l + gap <= n + 1; l++) {
        int r = l + gap;
        for (int k = l + 1; k < r; k++) {
          int cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r];
          dp[l][r] = max(dp[l][r], cand);
        }
      }
    }
    return dp[0][n + 1];
  }
};`,
        c: `// C
int maxCoins(int* nums, int numsSize) {
  int n = numsSize;
  int* vals = (int*)malloc(sizeof(int) * (n + 2));
  vals[0] = vals[n + 1] = 1;
  for (int i = 0; i < n; i++) vals[i + 1] = nums[i];
  // dp[l][r]：开区间 (l,r) 的最优值
  int** dp = (int**)malloc(sizeof(int*) * (n + 2));
  for (int i = 0; i < n + 2; i++) dp[i] = (int*)calloc(n + 2, sizeof(int));

  for (int gap = 2; gap <= n + 1; gap++) {
    for (int l = 0; l + gap <= n + 1; l++) {
      int r = l + gap;
      for (int k = l + 1; k < r; k++) {
        int cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r];
        if (cand > dp[l][r]) dp[l][r] = cand;
      }
    }
  }
  int ans = dp[0][n + 1];
  for (int i = 0; i < n + 2; i++) free(dp[i]);
  free(dp);
  free(vals);
  return ans;
}`
      };

      let params = { seed: 31201, speed: 1.0, n: 5 };
      let currentLang = "python";
      let nums = [];
      let vals = [];
      let dp = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let gap = 2;
      let l = 0;
      let k = 1;
      let stepInfo = null;

      function makeRng(seed) { let x = (seed >>> 0) || 1; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
      function genNums(n, seed) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i++) out.push(1 + Math.floor(rnd() * 8));
        return out;
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth || 500, container.offsetHeight || 600));
        switchLang("python");
      }

      function initializeSystem() {
        nums = presetRaw ? presetRaw.split(",").map((x) => parseInt(x.trim(), 10)).filter((x) => !Number.isNaN(x) && x >= 0) : genNums(params.n, params.seed);
        if (nums.length < 2) nums = [3, 1, 5, 8];
        vals = [1, ...nums, 1];
        const n = nums.length;
        dp = Array.from({ length: n + 2 }, () => Array(n + 2).fill(0));
        isDone = false;
        isPaused = false;
        timer = 0;
        gap = 2;
        l = 0;
        k = 1;
        stepInfo = null;
        document.getElementById("log-container").innerHTML = "";
        updateDataNodes();
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`输入数组：${nums.join(", ")}，补边界后为 [${vals.join(", ")}]。`, true);
      }

      function draw() {
        background(255);
        drawBalloonRow();
        drawMatrix();
        drawStatus();
        if (isPaused || isDone) return;
        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 0.85) {
          performStep();
          timer = 0;
        }
      }

      function drawBalloonRow() {
        const n = vals.length;
        const gapPx = Math.max(28, Math.min(44, (width - 120) / Math.max(n - 1, 1)));
        const nodeW = Math.max(22, Math.min(34, gapPx - 4));
        const sx = Math.max(50, width / 2 - ((n - 1) * gapPx) / 2);
        const y = 92;
        fill(90); noStroke(); textSize(12); textAlign(LEFT, CENTER); text("扩展数组 vals（含边界 1）", 24, 58);
        const r = stepInfo ? stepInfo.r : -1;
        for (let i = 0; i < n; i++) {
          const x = sx + i * gapPx;
          let fc = "#fff", sc = "#ddd";
          if (stepInfo && (i === l || i === r)) { fc = "#fff3ee"; sc = "#d97757"; }
          if (stepInfo && i === k) { fc = "#f6fbef"; sc = "#788c5d"; }
          stroke(sc); strokeWeight(1.2); fill(fc); rect(x - nodeW / 2, y - 18, nodeW, 36, 6);
          noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(13); text(vals[i], x, y);
        }
      }

      function drawMatrix() {
        const n = vals.length;
        const cell = Math.floor(Math.min((width - 120) / Math.max(n, 1), (height - 310) / Math.max(n, 1)));
        const sx = (width - cell * n) / 2;
        const sy = 145;
        fill(90); noStroke(); textSize(12); textAlign(LEFT, CENTER); text("dp[l][r]（开区间 (l,r) 的最优值）", 24, 124);
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            const x = sx + j * cell, y = sy + i * cell;
            let fc = "#fff", sc = "#ddd";
            if (j <= i + 1) { fc = "#fafafa"; sc = "#eee"; }
            if (dp[i][j] > 0) { fc = "#eef3ff"; sc = "#6a9bcc"; }
            if (stepInfo && i === l && j === stepInfo.r) { fc = "#fff3ee"; sc = "#d97757"; }
            if (stepInfo && ((i === l && j === k) || (i === k && j === stepInfo.r))) { fc = "#f6fbef"; sc = "#788c5d"; }
            stroke(sc); strokeWeight(1.1); fill(fc); rect(x, y, cell, cell, 4);
            noStroke(); fill("#333"); textAlign(CENTER, CENTER); textSize(Math.max(8, cell * 0.22));
            text(dp[i][j], x + cell / 2, y + cell / 2);
          }
        }
      }

      function drawStatus() {
        const n = nums.length;
        const bw = Math.min(560, width - 48), bh = 166;
        const bx = (width - bw) / 2, by = height - bh - 16;
        fill("#fffcf9"); stroke("#e8e6dc"); strokeWeight(1.4); rect(bx, by, bw, bh, 10); noStroke();
        fill("#666"); textAlign(CENTER, CENTER); textSize(12);
        text(`gap=${gap}  l=${l}  k=${k}  当前答案=${dp[0][n + 1]}`, bx + bw / 2, by + 22);
        textAlign(LEFT, CENTER); textSize(14);
        if (stepInfo) {
          fill("#6a9bcc"); text(stepInfo.d1, bx + 20, by + 58);
          fill("#d97757"); text(stepInfo.d2, bx + 20, by + 92);
          fill("#788c5d"); text(stepInfo.d3, bx + 20, by + 126);
        } else {
          fill("#777"); text("等待首个状态更新...", bx + 20, by + 92);
        }
      }

      function performStep() {
        const n = nums.length;
        if (gap > n + 1) {
          isDone = true;
          updateResult(`最终结果：${dp[0][n + 1]}`, "var(--green)");
          logMsg(`填表结束，最大硬币数 = ${dp[0][n + 1]}。`, true, "success");
          return;
        }
        const r = l + gap;
        if (r > n + 1) {
          gap++;
          l = 0;
          k = 1;
          stepInfo = null;
          logMsg(`切换到更大区间长度 gap=${gap}。`, true);
          return;
        }
        if (k <= l) k = l + 1;
        if (k >= r) {
          l++;
          k = l + 1;
          return;
        }

        const old = dp[l][r];
        const cand = dp[l][k] + dp[k][r] + vals[l] * vals[k] * vals[r];
        if (cand > dp[l][r]) dp[l][r] = cand;
        stepInfo = {
          r,
          d1: `区间 (${l},${r})，尝试最后戳 k=${k}`,
          d2: `cand = dp[${l}][${k}] + dp[${k}][${r}] + ${vals[l]}*${vals[k]}*${vals[r]} = ${cand}`,
          d3: `dp[${l}][${r}]：${old} -> ${dp[l][r]}`
        };
        logMsg(`(l=${l}, r=${r}, k=${k}) cand=${cand} best=${dp[l][r]}`, true);
        k++;
      }

      function updateDataNodes() {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        nums.forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = String(v);
          c.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }
      function updateResult(text, color) { const el = document.getElementById("result-label"); el.textContent = text; el.style.color = color; }
      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");
        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }
      function updateParam(id, val) { if (id in params) params[id] = parseFloat(val); document.getElementById(id + "-value").textContent = val; }
      function updateSeed() { params.seed = parseInt(document.getElementById("seed-input").value, 10) || 31201; presetRaw = ""; initializeSystem(); }
      function randomSeedAndUpdate() { params.seed = floor(random(1, 99999)); document.getElementById("seed-input").value = params.seed; presetRaw = ""; initializeSystem(); }
      function setPreset(raw) { presetRaw = raw; initializeSystem(); }
      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) { btn.innerHTML = "▶ 继续"; btn.style.background = "var(--green)"; }
        else { btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--dark)"; }
      }
      function resetAnimation() { initializeSystem(); }
    </script>
  </body>
</html>
