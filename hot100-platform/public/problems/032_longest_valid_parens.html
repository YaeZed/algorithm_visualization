  <body>

          <div class="memo-tip g">当 s[i]=')' 时，先看 i-1 的有效长度，再反推匹配下标 match。</div>

    <script>
      const SNIPPETS = {
        python: `# Python
def longestValidParentheses(s: str) -> int:
    n = len(s)
    # dp[i]：以 i 结尾的最长有效括号长度
    dp = [0] * n
    ans = 0

    for i in range(1, n):
        # 只有右括号才可能形成有效结尾
        if s[i] == ")":
            prev = dp[i - 1]
            match = i - prev - 1
            # 找到可匹配的左括号
            if match >= 0 and s[match] == "(":
                dp[i] = prev + 2
                # 拼接 match 前一段已完成的有效区间
                if match > 0:
                    dp[i] += dp[match - 1]
        ans = max(ans, dp[i])
    return ans`,
        ts: `// TypeScript
function longestValidParentheses(s: string): number {
  const n = s.length;
  // dp[i]：以 i 结尾的最长有效括号长度
  const dp = new Array(n).fill(0);
  let ans = 0;

  for (let i = 1; i < n; i++) {
    // 只有右括号能作为有效串结尾
    if (s[i] === ")") {
      const prev = dp[i - 1];
      const match = i - prev - 1;
      // match 位置必须是左括号
      if (match >= 0 && s[match] === "(") {
        dp[i] = prev + 2;
        // 再接上 match 前面的有效长度
        if (match > 0) dp[i] += dp[match - 1];
      }
    }
    ans = Math.max(ans, dp[i]);
  }
  return ans;
}`,
        java: `// Java
class Solution {
  public int longestValidParentheses(String s) {
    int n = s.length();
    // dp[i]：以 i 结尾的最长有效括号长度
    int[] dp = new int[n];
    int ans = 0;

    for (int i = 1; i < n; i++) {
      // 只有 ')' 才可能更新 dp[i]
      if (s.charAt(i) == ')') {
        int prev = dp[i - 1];
        int match = i - prev - 1;
        // 检查可配对的 '('
        if (match >= 0 && s.charAt(match) == '(') {
          dp[i] = prev + 2;
          // 连接 match 前面的有效段
          if (match > 0) dp[i] += dp[match - 1];
        }
      }
      ans = Math.max(ans, dp[i]);
    }
    return ans;
  }
}`,
        cpp: `// C++
class Solution {
public:
  int longestValidParentheses(string s) {
    int n = (int)s.size();
    // dp[i]：以 i 结尾的最长有效括号长度
    vector<int> dp(n, 0);
    int ans = 0;

    for (int i = 1; i < n; i++) {
      // 右括号才可能形成有效结尾
      if (s[i] == ')') {
        int prev = dp[i - 1];
        int match = i - prev - 1;
        // 检查 match 是否是左括号
        if (match >= 0 && s[match] == '(') {
          dp[i] = prev + 2;
          // 拼接前缀有效区间
          if (match > 0) dp[i] += dp[match - 1];
        }
      }
      ans = max(ans, dp[i]);
    }
    return ans;
  }
};`,
        c: `// C
int longestValidParentheses(char* s) {
  int n = (int)strlen(s);
  // dp[i]：以 i 结尾的最长有效括号长度
  int* dp = (int*)calloc(n, sizeof(int));
  int ans = 0;

  for (int i = 1; i < n; i++) {
    // 仅当 s[i] 为 ')' 时尝试转移
    if (s[i] == ')') {
      int prev = dp[i - 1];
      int match = i - prev - 1;
      // match 必须在范围内且为 '('
      if (match >= 0 && s[match] == '(') {
        dp[i] = prev + 2;
        // 累加 match 前面的有效长度
        if (match > 0) dp[i] += dp[match - 1];
      }
    }
    if (dp[i] > ans) ans = dp[i];
  }

  free(dp);
  return ans;
}`
      };

      let params = { seed: 32001, speed: 1.0, n: 10 };
      let currentLang = "python";
      let s = "";
      let dp = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let i = 1;
      let ans = 0;
      let stepInfo = null;

      function makeRng(seed) {
        let x = (seed >>> 0) || 1;
        return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296);
      }

      function generateString(n, seed) {
        const rnd = makeRng(seed);
        let out = "";
        for (let k = 0; k < n; k++) out += rnd() < 0.5 ? "(" : ")";
        return out;
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => {
          resizeCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        });
        switchLang("python");
      }

      function initializeSystem() {
        s = presetRaw || generateString(params.n, params.seed);
        if (s.length < 2) s = "()";
        dp = new Array(s.length).fill(0);
        isDone = false;
        isPaused = false;
        timer = 0;
        i = 1;
        ans = 0;
        stepInfo = null;

        document.getElementById("log-container").innerHTML = "";
        updateDataNodes(s);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`输入字符串：${s}，初始化 dp 全 0。`, true);
      }

      function draw() {
        background(255);
        drawStringRow();
        drawDpRow();
        drawStatus();
        if (isPaused || isDone) return;

        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 1.0) {
          performStep();
          timer = 0;
        }
      }

      function drawStringRow() {
        const n = s.length;
        const gap = Math.max(28, Math.min(42, (width - 120) / Math.max(n - 1, 1)));
        const nodeW = Math.max(22, Math.min(32, gap - 4));
        const nodeH = 40;
        const startX = Math.max(50, width / 2 - ((n - 1) * gap) / 2);
        const y = 120;

        fill(90);
        noStroke();
        textSize(13);
        textAlign(LEFT, CENTER);
        text("字符串 s", 24, 70);

        for (let k = 0; k < n; k++) {
          const x = startX + k * gap;
          const isI = !isDone && k === i;
          const isMatch = stepInfo && k === stepInfo.match;
          const inSpan = stepInfo && stepInfo.validStart >= 0 && k >= stepInfo.validStart && k <= stepInfo.i;
          let strokeColor = "#ddd";
          let fillColor = "#fff";

          if (inSpan) {
            fillColor = "#eef3ff";
            strokeColor = "#6a9bcc";
          }
          if (isMatch) {
            fillColor = "#f6fbef";
            strokeColor = "#788c5d";
          }
          if (isI) {
            fillColor = "#fff3ee";
            strokeColor = "#d97757";
          }

          stroke(strokeColor);
          strokeWeight(isI || isMatch ? 2.2 : 1.2);
          fill(fillColor);
          rect(x - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 7);

          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(16);
          text(s[k], x, y);

          fill("#999");
          textSize(9);
          text(k, x, y + 29);
        }
      }

      function drawDpRow() {
        const n = s.length;
        const gap = Math.max(26, Math.min(36, (width - 120) / Math.max(n - 1, 1)));
        const nodeW = Math.max(20, Math.min(30, gap - 4));
        const nodeH = 34;
        const startX = Math.max(48, width / 2 - ((n - 1) * gap) / 2);
        const y = 248;

        fill(90);
        noStroke();
        textSize(13);
        textAlign(LEFT, CENTER);
        text("dp[i]", 24, 202);

        for (let k = 0; k < n; k++) {
          const x = startX + k * gap;
          const isI = !isDone && k === i;
          const isPrev = stepInfo && k === i - 1;
          let strokeColor = "#ddd";
          let fillColor = "#fff";
          if (dp[k] > 0) {
            fillColor = "#eef3ff";
            strokeColor = "#6a9bcc";
          }
          if (isPrev) {
            fillColor = "#f6fbef";
            strokeColor = "#788c5d";
          }
          if (isI) {
            fillColor = "#fff3ee";
            strokeColor = "#d97757";
          }

          stroke(strokeColor);
          strokeWeight(isI || isPrev ? 2.1 : 1.1);
          fill(fillColor);
          rect(x - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 6);

          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(11);
          text(dp[k], x, y);

          fill("#999");
          textSize(8);
          text(k, x, y + 24);
        }
      }

      function drawStatus() {
        const bw = Math.min(520, width - 48);
        const bh = 176;
        const bx = (width - bw) / 2;
        const minBy = 300;
        const maxBy = height - bh - 16;
        const by = Math.max(minBy, Math.min(maxBy, height / 2 + 74));

        fill("#fffcf9");
        stroke("#e8e6dc");
        strokeWeight(1.4);
        rect(bx, by, bw, bh, 10);
        noStroke();

        fill("#666");
        textAlign(CENTER, CENTER);
        textSize(12);
        text(`i=${Math.min(i, s.length - 1)}  ans=${ans}`, bx + bw / 2, by + 24);

        textAlign(LEFT, CENTER);
        textSize(14);
        if (stepInfo) {
          fill("#6a9bcc");
          text(`字符 s[${stepInfo.i}]='${stepInfo.cur}'，dp[i-1]=${stepInfo.prev}`, bx + 20, by + 56);
          fill("#d97757");
          text(`match=${stepInfo.match}，是否命中左括号：${stepInfo.hit}`, bx + 20, by + 88);
          fill("#788c5d");
          text(`dp[${stepInfo.i}] 更新为 ${stepInfo.value}`, bx + 20, by + 120);
          fill("#444");
          text(`当前最大长度 ans=${ans}`, bx + 20, by + 150);
        } else {
          fill("#777");
          text("等待首个状态更新...", bx + 20, by + 96);
        }
      }

      function performStep() {
        const n = s.length;
        if (i >= n) {
          isDone = true;
          updateResult(`最终结果：${ans}`, "var(--green)");
          logMsg(`遍历结束，最长有效括号长度为 ${ans}。`, true, "success");
          return;
        }

        const cur = s[i];
        let value = 0;
        let prev = 0;
        let match = -1;
        let hit = false;
        let validStart = -1;

        if (cur === ")") {
          prev = dp[i - 1];
          match = i - prev - 1;
          if (match >= 0 && s[match] === "(") {
            hit = true;
            value = prev + 2;
            if (match > 0) value += dp[match - 1];
            validStart = i - value + 1;
          }
        }

        dp[i] = value;
        if (value > ans) ans = value;
        stepInfo = { i, cur, prev, match, hit, value, validStart };

        if (cur === "(") {
          logMsg(`i=${i}, s[i]='('，无法作为有效结尾，dp[${i}]=0。`, true);
        } else if (!hit) {
          logMsg(`i=${i}, s[i]=')'，match=${match} 不可配对，dp[${i}]=0。`, true);
        } else {
          logMsg(`i=${i}, 命中配对，dp[${i}]=${value}，当前 ans=${ans}。`, true);
        }

        i++;
        if (i >= n) {
          isDone = true;
          updateResult(`最终结果：${ans}`, "var(--green)");
          logMsg(`状态计算完成，答案为 ${ans}。`, true, "success");
        }
      }

      function updateDataNodes(str) {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        for (const ch of str) {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = ch;
          c.appendChild(node);
        }
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");

        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 32001;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function setPreset(raw) {
        presetRaw = raw;
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
