    <style>

      .button { width: 100%; border: none; background: var(--orange); color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
      .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .preset { border: 1px solid var(--line); border-radius: 6px; padding: 7px 6px; background: #fff; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer; }
      .canvas-area { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      .canvas-header { padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: #888; display: flex; justify-content: space-between; }
      #canvas-container { flex: 1; width: 100%; height: 100%; }
      .right-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 15px; }
      .code-box { flex: 1.08; background: #1e1e1e; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      .box-header.dark { background: #282828; border-bottom: 1px solid #1e1e1e; padding: 10px 15px 0; display: flex; justify-content: space-between; align-items: center; }
      .box-title.dark { color: #ccc; font-size: 12px; font-weight: 600; padding-bottom: 10px; }

      .memo-time { background: #fff3ee; color: var(--orange); border: 1px solid #f0c8b0; }
      .memo-space { background: #eef3ff; color: var(--blue); border: 1px solid #b8d0f0; }
      .memo-tip { padding: 6px 9px; font-size: 11px; line-height: 1.5; color: #555; background: #fffcf9; border-left: 3px solid var(--orange); border-radius: 0 5px 5px 0; margin-bottom: 6px; }
      .memo-tip.g { border-left-color: var(--green); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>乘积最大子数组</h1>
        <div class="subtitle">LeetCode 152 · 双状态 DP（curMax / curMin）</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="15201" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">生成随机样例</button>
        </div>
        <div class="control-section">
          <h3>参数控制</h3>
          <div class="control-group">
            <label>动画速度</label>
            <div class="slider-container">
              <input type="range" id="speed" min="0.1" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)" />
              <span class="value-display" id="speed-value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>数组长度</label>
            <div class="slider-container">
              <input type="range" id="n" min="5" max="14" step="1" value="8" oninput="updateParam('n', this.value)" />
              <span class="value-display" id="n-value">8</span>
            </div>
          </div>
          <div class="control-group">
            <label>预设样例</label>
            <div class="preset-grid">
              <button class="preset" onclick="setPreset('2,3,-2,4')">2,3,-2,4</button>
              <button class="preset" onclick="setPreset('-2,0,-1')">-2,0,-1</button>
              <button class="preset" onclick="setPreset('-2,3,-4')">-2,3,-4</button>
              <button class="preset" onclick="setPreset('1,-2,-3,4')">1,-2,-3,4</button>
            </div>
          </div>
        </div>
        <div class="control-section" style="display:flex; gap:10px">
          <button id="pause-btn" class="button" style="background:var(--dark)" onclick="togglePause()">⏸ 暂停</button>
          <button class="button" style="background:var(--blue)" onclick="resetAnimation()">🔄 重新运行</button>
        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(n)</span>
            <span class="memo-badge memo-space">空间 O(1)</span>
          </div>
          <div class="memo-tip">由于负数会把最大值和最小值互换角色，必须同时维护 curMax 与 curMin。</div>
          <div class="memo-tip g">每一步从三个候选取 max/min：x、x*oldMax、x*oldMin。</div>
          <div class="memo-tip w">globalMax 记录全局答案，不能只看当前 curMax。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>双状态乘积转移可视化</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">输入数组</div>
            <div id="data-nodes" class="data-array"></div>
          </div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def maxProduct(nums: list[int]) -> int:
    # cur_max/cur_min: 以当前位置结尾的最大/最小乘积
    cur_max = nums[0]
    cur_min = nums[0]
    ans = nums[0]  # 全局最大乘积

    for i in range(1, len(nums)):
        x = nums[i]
        # 先保存旧值，避免覆盖后影响另一个转移
        old_max = cur_max
        old_min = cur_min

        # 三个候选：单独开新段 / 接在旧最大后 / 接在旧最小后
        cur_max = max(x, x * old_max, x * old_min)
        cur_min = min(x, x * old_max, x * old_min)

        # 更新全局答案
        ans = max(ans, cur_max)
    return ans`,
        ts: `// TypeScript
function maxProduct(nums: number[]): number {
  // curMax/curMin：以当前位置结尾的最大/最小乘积
  let curMax = nums[0], curMin = nums[0], ans = nums[0];
  for (let i = 1; i < nums.length; i++) {
    const x = nums[i];
    // 覆盖前先保存旧状态
    const oldMax = curMax, oldMin = curMin;
    // 三种候选转移：x、x*oldMax、x*oldMin
    curMax = Math.max(x, x * oldMax, x * oldMin);
    curMin = Math.min(x, x * oldMax, x * oldMin);
    // 更新全局最优
    ans = Math.max(ans, curMax);
  }
  return ans;
}`,
        java: `// Java
class Solution {
  public int maxProduct(int[] nums) {
    // curMax/curMin：以 i 结尾的最大/最小乘积
    int curMax = nums[0], curMin = nums[0], ans = nums[0];
    for (int i = 1; i < nums.length; i++) {
      int x = nums[i];
      // 先保存旧状态
      int oldMax = curMax, oldMin = curMin;
      // 三种候选转移：x、x*oldMax、x*oldMin
      curMax = Math.max(x, Math.max(x * oldMax, x * oldMin));
      curMin = Math.min(x, Math.min(x * oldMax, x * oldMin));
      // 更新全局答案
      ans = Math.max(ans, curMax);
    }
    return ans;
  }
}`,
        cpp: `// C++
class Solution {
public:
  int maxProduct(vector<int>& nums) {
    // curMax/curMin：以当前位置结尾的最大/最小乘积
    int curMax = nums[0], curMin = nums[0], ans = nums[0];
    for (int i = 1; i < (int)nums.size(); i++) {
      int x = nums[i];
      // 覆盖前先快照旧值
      int oldMax = curMax, oldMin = curMin;
      // 三候选转移
      curMax = max(x, max(x * oldMax, x * oldMin));
      curMin = min(x, min(x * oldMax, x * oldMin));
      // 维护全局最优
      ans = max(ans, curMax);
    }
    return ans;
  }
};`,
        c: `// C
int maxProduct(int* nums, int numsSize) {
  // curMax/curMin：以 i 结尾的最大/最小乘积
  int curMax = nums[0], curMin = nums[0], ans = nums[0];
  for (int i = 1; i < numsSize; i++) {
    int x = nums[i];
    // 更新前先备份旧状态
    int oldMax = curMax, oldMin = curMin;
    // 三种候选转移：x、x*oldMax、x*oldMin
    int c1 = x, c2 = x * oldMax, c3 = x * oldMin;
    curMax = c1 > c2 ? (c1 > c3 ? c1 : c3) : (c2 > c3 ? c2 : c3);
    curMin = c1 < c2 ? (c1 < c3 ? c1 : c3) : (c2 < c3 ? c2 : c3);
    // 更新全局最大值
    ans = ans > curMax ? ans : curMax;
  }
  return ans;
}`
      };

      let params = { seed: 15201, speed: 1.0, n: 8 };
      let currentLang = "python";
      let arr = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let idx = 1;
      let curMax = 0;
      let curMin = 0;
      let globalMax = 0;
      let stepInfo = null;
      let ptrX = 0;
      let ptrTargetX = 0;

      function makeRng(seed) {
        let s = (seed >>> 0) || 1;
        return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
      }

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth, container.offsetHeight));
        switchLang("python");
      }

      function initializeSystem() {
        arr = presetRaw ? parsePreset(presetRaw) : generateArray(params.n, params.seed);
        if (arr.length < 2) arr = [2, 3];
        isDone = false;
        isPaused = false;
        timer = 0;
        idx = 1;
        curMax = arr[0];
        curMin = arr[0];
        globalMax = arr[0];
        stepInfo = null;
        ptrX = 70;
        ptrTargetX = 70;
        document.getElementById("log-container").innerHTML = "";
        updateDataUI(arr);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`输入数组：${arr.join(", ")}。初始化 curMax=curMin=ans=${arr[0]}。`, true);
      }

      function parsePreset(raw) {
        return raw.split(",").map((s) => parseInt(s.trim(), 10)).filter((v) => Number.isFinite(v));
      }

      function generateArray(n, seed) {
        const rand = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i++) out.push(-8 + floor(rand() * 17));
        if (out.every((x) => x === 0)) out[0] = 2;
        return out;
      }

      function draw() {
        background(255);
        drawArray();
        drawStatus();
        if (isPaused || isDone) return;
        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 1.0) {
          performStep();
          timer = 0;
        }
      }

      function drawArray() {
        const gap = Math.max(30, Math.min(54, (width - 130) / Math.max(arr.length - 1, 1)));
        const nodeW = Math.max(24, Math.min(36, gap - 4));
        const nodeH = 42;
        const startX = Math.max(54, width / 2 - ((arr.length - 1) * gap) / 2);
        const y = 160;
        ptrX = lerp(ptrX, ptrTargetX, 0.12 * params.speed);
        fill(90); noStroke(); textSize(13); textAlign(LEFT, CENTER); text("输入数组 nums", 24, 72);

        for (let i = 0; i < arr.length; i++) {
          const cx = startX + i * gap;
          const active = i === idx && !isDone;
          let fillColor = "#fff", strokeColor = "#ddd";
          if (i < idx) { fillColor = "#eef3ff"; strokeColor = "#6a9bcc"; }
          if (active) { fillColor = "#fff3ee"; strokeColor = "#d97757"; }
          stroke(strokeColor); strokeWeight(active ? 2.2 : 1.2); fill(fillColor);
          rect(cx - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 7);
          noStroke(); fill("#222"); textAlign(CENTER, CENTER); textSize(nodeW < 30 ? 14 : 16); text(arr[i], cx, y);
          fill("#aaa"); textSize(10); text(i, cx, y + 31);
        }

        if (!isDone && idx < arr.length) {
          stroke("#d97757"); strokeWeight(2); line(ptrX, y + 53, ptrX, y + 28);
          fill("#d97757"); noStroke(); triangle(ptrX, y + 22, ptrX - 5, y + 32, ptrX + 5, y + 32);
          fill("#d97757"); textSize(11); text("i", ptrX, y + 69);
        }
      }

      function drawStatus() {
        const bw = Math.min(430, width - 48);
        const bh = 180;
        const bx = (width - bw) / 2;
        const minBy = 232;
        const maxBy = height - bh - 16;
        const by = Math.max(minBy, Math.min(maxBy, height / 2 + 30));
        fill("#fffcf9"); stroke("#e8e6dc"); strokeWeight(1.4); rect(bx, by, bw, bh, 10);
        noStroke();

        textAlign(CENTER, CENTER);
        fill("#666"); textSize(12); text(`idx=${Math.min(idx, arr.length)}  curMax=${curMax}  curMin=${curMin}  ans=${globalMax}`, bx + bw / 2, by + 24);

        textAlign(LEFT, CENTER);
        textSize(14);
        if (stepInfo) {
          fill("#6a9bcc"); text(`x=${stepInfo.x}, x*oldMax=${stepInfo.c2}`, bx + 20, by + 62);
          fill("#d97757"); text(`x*oldMin=${stepInfo.c3}, oldMax=${stepInfo.oldMax}, oldMin=${stepInfo.oldMin}`, bx + 20, by + 90);
          fill("#788c5d"); text(`new curMax=${stepInfo.newMax}, new curMin=${stepInfo.newMin}`, bx + 20, by + 118);
          fill("#444"); text(`global ans=${globalMax}`, bx + 20, by + 146);
        } else {
          fill("#777"); text("等待第一步转移...", bx + 20, by + 90);
        }
      }

      // 每步根据三个候选更新 curMax/curMin，并维护全局最大值
      function performStep() {
        if (idx >= arr.length) {
          isDone = true;
          updateResult(`最优乘积：${globalMax}`, "var(--green)");
          logMsg(`计算结束，答案为 ${globalMax}。`, true, "success");
          return;
        }

        const x = arr[idx];
        const oldMax = curMax;
        const oldMin = curMin;
        const c1 = x;
        const c2 = x * oldMax;
        const c3 = x * oldMin;
        const newMax = max(c1, c2, c3);
        const newMin = min(c1, c2, c3);

        stepInfo = { x, oldMax, oldMin, c1, c2, c3, newMax, newMin };

        const gap = Math.max(30, Math.min(54, (width - 130) / Math.max(arr.length - 1, 1)));
        const startX = Math.max(54, width / 2 - ((arr.length - 1) * gap) / 2);
        ptrTargetX = startX + idx * gap;

        logMsg(
          `i=${idx}, x=${x}：候选 {x=${c1}, x*oldMax=${c2}, x*oldMin=${c3}} => curMax=${newMax}, curMin=${newMin}。`,
          true
        );

        curMax = newMax;
        curMin = newMin;
        globalMax = max(globalMax, curMax);
        idx += 1;

        if (idx >= arr.length) {
          isDone = true;
          updateResult(`最优乘积：${globalMax}`, "var(--green)");
          logMsg(`全部处理完成，最大乘积子数组值 = ${globalMax}。`, true, "success");
        }
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function updateDataUI(array) {
        const c = document.getElementById("data-nodes");
        c.innerHTML = "";
        array.forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          c.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");
        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
        if (id !== "speed") {
          presetRaw = "";
          initializeSystem();
        }
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 15201;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function setPreset(raw) {
        presetRaw = raw;
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
