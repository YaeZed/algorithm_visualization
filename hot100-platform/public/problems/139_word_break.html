      .box-header.dark { background: #282828; border-bottom: 1px solid #1e1e1e; padding: 10px 15px 0; display: flex; justify-content: space-between; align-items: center; }
      .box-title.dark { color: #ccc; font-size: 12px; font-weight: 600; padding-bottom: 10px; }
      .tabs.dark { display: flex; gap: 1px; align-items: flex-end; }

      .memo-badges { display: flex; gap: 6px; margin-bottom: 10px; }

      .memo-tip { padding: 6px 9px; font-size: 11px; line-height: 1.5; color: #555; background: #fffcf9; border-left: 3px solid var(--orange); border-radius: 0 5px 5px 0; margin-bottom: 6px; }
      .memo-tip.g { border-left-color: var(--green); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>单词拆分</h1>
        <div class="subtitle">LeetCode 139 · 前缀布尔 DP</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="13901" onchange="updateSeed()" />

              <button class="preset" onclick="setPreset('leetcode|leet,code')">leetcode | [leet, code]</button>

              <button class="preset" onclick="setPreset('catsandog|cats,dog,sand,and,cat')">catsandog | [cats,dog,sand,and,cat]</button>

        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(n²)</span>
            <span class="memo-badge memo-space">空间 O(n)</span>
          </div>
          <div class="memo-tip">dp[i] 表示前缀 s[0:i) 是否可被字典拆分。</div>
          <div class="memo-tip g">若存在 j&lt;i，满足 dp[j] 为真且 s[j:i] 在字典中，则 dp[i]=true。</div>
          <div class="memo-tip w">一旦找到可行切分点 j，就可提前结束该 i 的内层枚举。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>前缀布尔 DP 可视化</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">字典单词</div>
            <div id="dict-nodes" class="data-array"></div>
          </div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def wordBreak(s: str, wordDict: list[str]) -> bool:
    # dp[i] 表示前缀 s[0:i) 是否可被拆分
    word_set = set(wordDict)
    n = len(s)
    dp = [False] * (n + 1)
    dp[0] = True

    for i in range(1, n + 1):
        # 枚举切分点 j
        for j in range(i):
            # 若前缀可达且当前子串在字典中，则 i 可达
            if dp[j] and s[j:i] in word_set:
                dp[i] = True
                break
    return dp[n]`,
        ts: `// TypeScript
function wordBreak(s: string, wordDict: string[]): boolean {
  // dp[i] 表示前缀 s[0:i) 是否可被拆分
  const n = s.length;
  const set = new Set(wordDict);
  const dp = new Array(n + 1).fill(false);
  dp[0] = true;

  for (let i = 1; i <= n; i++) {
    // 枚举切分点 j
    for (let j = 0; j < i; j++) {
      // 前缀可达 + 子串在字典中 => dp[i] 为真
      if (dp[j] && set.has(s.slice(j, i))) {
        dp[i] = true;
        break;
      }
    }
  }
  return dp[n];
}`,
        java: `// Java
class Solution {
  public boolean wordBreak(String s, List<String> wordDict) {
    // dp[i] 表示前缀 s[0:i) 是否可被拆分
    int n = s.length();
    Set<String> set = new HashSet<>(wordDict);
    boolean[] dp = new boolean[n + 1];
    dp[0] = true;

    for (int i = 1; i <= n; i++) {
      // 枚举切分点 j
      for (int j = 0; j < i; j++) {
        // 前缀可达且子串命中字典，更新 dp[i]
        if (dp[j] && set.contains(s.substring(j, i))) {
          dp[i] = true;
          break;
        }
      }
    }
    return dp[n];
  }
}`,
        cpp: `// C++
class Solution {
public:
  bool wordBreak(string s, vector<string>& wordDict) {
    // dp[i] 表示前缀 s[0:i) 是否可被拆分
    int n = (int)s.size();
    unordered_set<string> set(wordDict.begin(), wordDict.end());
    vector<int> dp(n + 1, 0);
    dp[0] = 1;

    for (int i = 1; i <= n; i++) {
      // 枚举切分点 j
      for (int j = 0; j < i; j++) {
        // 前缀可达且子串在字典中，则 dp[i] = 1
        if (dp[j] && set.count(s.substr(j, i - j))) {
          dp[i] = 1;
          break;
        }
      }
    }
    return dp[n];
  }
};`,
        c: `// C
// 说明：inDict 为辅助函数，用于判断 s[j:i) 是否在字典中
bool wordBreak(char* s, char** wordDict, int wordDictSize) {
  // dp[i] 表示前缀 s[0:i) 是否可被拆分
  int n = strlen(s);
  bool* dp = (bool*)calloc(n + 1, sizeof(bool));
  dp[0] = true;

  for (int i = 1; i <= n; i++) {
    // 枚举切分点 j
    for (int j = 0; j < i; j++) {
      // 前缀可达且子串在字典中，则 dp[i] = true
      if (dp[j] && inDict(s, j, i, wordDict, wordDictSize)) {
        dp[i] = true;
        break;
      }
    }
  }

  bool ans = dp[n];
  free(dp);
  return ans;
}`
      };

      const CASES = [
        { s: "leetcode", dict: ["leet", "code"] },
        { s: "applepenapple", dict: ["apple", "pen"] },
        { s: "catsandog", dict: ["cats", "dog", "sand", "and", "cat"] },
        { s: "cars", dict: ["car", "ca", "rs"] }
      ];

      let params = { seed: 13901, speed: 1.0 };
      let currentLang = "python";
      let s = "";
      let dict = [];
      let set = new Set();
      let dp = [];
      let presetRaw = "";
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let i = 1;
      let j = 0;
      let stepInfo = null;

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => {
          resizeCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        });
        switchLang("python");
      }

      function initializeSystem() {
        let chosen;
        if (presetRaw) {
          chosen = parsePreset(presetRaw);
        } else {
          const idx = (params.seed >>> 0) % CASES.length;
          chosen = CASES[idx];
        }

        s = chosen.s;
        dict = [...chosen.dict];
        set = new Set(dict);
        dp = new Array(s.length + 1).fill(false);
        dp[0] = true;
        isDone = false;
        isPaused = false;
        timer = 0;
        i = 1;
        j = 0;
        stepInfo = null;

        document.getElementById("log-container").innerHTML = "";
        updateDictUI(dict);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn");
        btn.innerHTML = "⏸ 暂停";
        btn.style.background = "var(--dark)";
        logMsg(`输入 s="${s}"，dict=[${dict.join(", ")}]，初始化 dp[0]=true。`, true);
      }

      function parsePreset(raw) {
        const parts = raw.split("|");
        const ss = (parts[0] || "").trim();
        const words = (parts[1] || "").trim();
        const arr = words ? words.split(",").map((x) => x.trim()).filter(Boolean) : [];
        return { s: ss, dict: arr };
      }

      function draw() {
        background(255);
        drawString();
        drawDp();
        drawStatus();
        if (isPaused || isDone) return;

        timer += (deltaTime / 1000) * params.speed;
        if (timer >= 1.0) {
          performStep();
          timer = 0;
        }
      }

      function drawString() {
        const n = s.length;
        const gap = Math.max(30, Math.min(50, (width - 130) / Math.max(n - 1, 1)));
        const nodeW = Math.max(24, Math.min(36, gap - 4));
        const nodeH = 40;
        const startX = Math.max(54, width / 2 - ((n - 1) * gap) / 2);
        const y = 140;

        fill(90);
        noStroke();
        textSize(13);
        textAlign(LEFT, CENTER);
        text("字符串 s", 24, 70);

        for (let k = 0; k < n; k++) {
          const cx = startX + k * gap;
          const inRange = stepInfo && k >= stepInfo.j && k < stepInfo.i;
          stroke(inRange ? "#d97757" : "#ddd");
          strokeWeight(inRange ? 2.2 : 1.2);
          fill(inRange ? "#fff3ee" : "#fff");
          rect(cx - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 7);

          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(16);
          text(s[k], cx, y);

          fill("#aaa");
          textSize(10);
          text(k, cx, y + 30);
        }
      }

      function drawDp() {
        const n = s.length;
        const gap = Math.max(26, Math.min(44, (width - 120) / Math.max(n, 1)));
        const nodeW = Math.max(22, Math.min(34, gap - 3));
        const nodeH = 36;
        const startX = Math.max(44, width / 2 - (n * gap) / 2);
        const y = 265;

        fill(90);
        noStroke();
        textSize(13);
        textAlign(LEFT, CENTER);
        text("dp[0..n]", 24, 210);

        for (let k = 0; k <= n; k++) {
          const cx = startX + k * gap;
          const curI = k === i && !isDone;
          const curJ = k === j && !isDone;
          const done = k < i;
          let fillColor = "#fff";
          let strokeColor = "#ddd";

          if (done) {
            fillColor = "#eef3ff";
            strokeColor = "#6a9bcc";
          }
          if (curI) {
            fillColor = "#fff3ee";
            strokeColor = "#d97757";
          }
          if (curJ) {
            fillColor = "#f6fbef";
            strokeColor = "#788c5d";
          }

          stroke(strokeColor);
          strokeWeight(curI || curJ ? 2.1 : 1.1);
          fill(fillColor);
          rect(cx - nodeW / 2, y - nodeH / 2, nodeW, nodeH, 6);

          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(12);
          text(dp[k] ? "T" : "F", cx, y);

          fill("#aaa");
          textSize(9);
          text(k, cx, y + 27);
        }
      }

      function drawStatus() {
        const bw = Math.min(460, width - 48);
        const bh = 170;
        const bx = (width - bw) / 2;
        const minBy = 302;
        const maxBy = height - bh - 16;
        const by = Math.max(minBy, Math.min(maxBy, height / 2 + 80));

        fill("#fffcf9");
        stroke("#e8e6dc");
        strokeWeight(1.4);
        rect(bx, by, bw, bh, 10);

        noStroke();
        textAlign(CENTER, CENTER);
        fill("#666");
        textSize(12);
        text(`i=${Math.min(i, s.length)}  j=${Math.min(j, i)}  dp[n]=${dp[s.length] ? "true" : "false"}`, bx + bw / 2, by + 24);

        textAlign(LEFT, CENTER);
        textSize(14);
        if (stepInfo) {
          fill("#6a9bcc");
          text(`子串 s[${stepInfo.j}:${stepInfo.i}) = "${stepInfo.sub}"`, bx + 20, by + 58);
          fill("#d97757");
          text(`检查 dp[${stepInfo.j}]=${stepInfo.dpJ}，inDict=${stepInfo.inDict}`, bx + 20, by + 88);
          fill("#788c5d");
          text(`当前 dp[${stepInfo.i}] = ${dp[stepInfo.i]}`, bx + 20, by + 118);
          fill("#444");
          text(`下一步：${stepInfo.hit ? "命中字典，推进到下一个 i" : "继续增大 j"}`, bx + 20, by + 148);
        } else {
          fill("#777");
          text("等待首个状态更新...", bx + 20, by + 88);
        }
      }

      function performStep() {
        const n = s.length;
        if (i > n) {
          isDone = true;
          updateResult(`最终结果：${dp[n] ? "true" : "false"}`, "var(--green)");
          logMsg(`遍历结束，答案为 ${dp[n]}。`, true, "success");
          return;
        }

        const sub = s.slice(j, i);
        const dpJ = dp[j];
        const inDict = set.has(sub);
        const hit = dpJ && inDict;
        stepInfo = { i, j, sub, dpJ, inDict, hit };
        logMsg(`i=${i}, j=${j}, 子串="${sub}"，dp[j]=${dpJ}, inDict=${inDict}。`, true);

        if (hit) {
          dp[i] = true;
          logMsg(`命中字典，设置 dp[${i}] = true。`, true);
          i++;
          j = 0;
        } else {
          j++;
          if (j >= i) {
            logMsg(`i=${i} 未找到可行切分，dp[${i}] 保持 false。`, true);
            i++;
            j = 0;
          }
        }

        if (i > n) {
          isDone = true;
          updateResult(`最终结果：${dp[n] ? "true" : "false"}`, "var(--green)");
          logMsg(`状态计算完成，答案为 ${dp[n]}。`, true, "success");
        }
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function updateDictUI(array) {
        const c = document.getElementById("dict-nodes");
        c.innerHTML = "";
        array.forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          c.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false, extraClass = "") {
        const c = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "") + (extraClass ? ` ${extraClass}` : "");
        const t = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${t}</div>${msg}`;
        c.appendChild(item);
        c.scrollTop = c.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");

        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 13901;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function setPreset(raw) {
        presetRaw = raw;
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
