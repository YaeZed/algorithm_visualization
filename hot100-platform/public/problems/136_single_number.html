<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>只出现一次的数字 - LeetCode 136</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
    <style>
      :root { --dark:#141413; --light:#faf9f5; --mid:#b0aea5; --line:#e8e6dc; --orange:#d97757; --blue:#6a9bcc; --green:#788c5d; }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:"Poppins","PingFang SC",sans-serif; background:#fdfcf9; color:var(--dark); overflow:hidden; }
      .container { display:flex; height:100vh; padding:15px; gap:15px; }
      .sidebar { width:280px; flex-shrink:0; background:#fff; padding:20px; border-radius:12px; border:1px solid var(--line); overflow-y:auto; }
      .sidebar h1 { font-family:"Lora",serif; font-size:18px; margin-bottom:4px; color:var(--orange); }
      .subtitle { color:var(--mid); font-size:11px; margin-bottom:20px; }
      .control-section { margin-bottom:18px; }
      .control-section h3 { font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
      .control-section h3::before { content:""; width:4px; height:14px; background:var(--orange); border-radius:2px; }
      .control-group { margin-bottom:10px; }
      .control-group label { display:block; font-size:12px; margin-bottom:4px; color:#666; }
      .slider-container { display:flex; align-items:center; gap:10px; }
      input[type="range"] { flex:1; height:4px; background:var(--line); border-radius:2px; appearance:none; outline:none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:var(--orange); border-radius:50%; border:2px solid #fff; }
      .value-display { font-family:"JetBrains Mono",monospace; font-size:11px; min-width:25px; text-align:right; }
      .seed-input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; font-family:"JetBrains Mono",monospace; font-size:12px; }
      .button { background:var(--orange); color:#fff; border:none; padding:10px; border-radius:6px; width:100%; cursor:pointer; font-size:13px; font-weight:500; }
      .button:hover { background:#c86641; }
      .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
      .preset { border:1px solid var(--line); border-radius:6px; padding:7px 6px; background:#fff; font-family:"JetBrains Mono",monospace; font-size:11px; cursor:pointer; }
      .preset:hover { border-color:var(--orange); color:var(--orange); }
      .canvas-area { flex:1; background:#fff; border-radius:12px; border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
      .canvas-header { padding:10px 20px; border-bottom:1px solid var(--line); font-size:13px; color:#888; display:flex; justify-content:space-between; }
      #canvas-container { flex:1; width:100%; height:100%; }
      .right-panel { flex:1; min-width:0; display:flex; flex-direction:column; gap:15px; }
      .code-box { flex:1.08; background:#1e1e1e; border-radius:12px; border:1px solid #333; display:flex; flex-direction:column; overflow:hidden; }
      .box-header.dark { background:#282828; border-bottom:1px solid #1e1e1e; padding:10px 15px 0; display:flex; justify-content:space-between; align-items:center; }
      .box-title.dark { color:#ccc; padding-bottom:10px; font-size:12px; font-weight:600; }
      .tabs.dark { display:flex; gap:1px; align-items:flex-end; }
      .tabs.dark .tab { padding:8px 16px; border-radius:6px 6px 0 0; background:#2d2d2d; color:#888; cursor:pointer; font-size:11px; }
      .tabs.dark .tab.active { background:#1e1e1e; color:#4ec9b0; border-top:2px solid #007acc; }
      .code-content { flex:1; margin:0; overflow:auto; }
      #code-viewer { padding:15px; font-family:Consolas,"JetBrains Mono",monospace; font-size:14px; line-height:1.55; color:#d4d4d4; }
      .logic-box { flex:.92; background:#fff; border-radius:12px; border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
      .box-header { padding:8px 15px; background:#fff; border-bottom:1px solid #eee; }
      .box-title { font-size:12px; font-weight:600; color:#555; }
      .data-viz { padding:12px; background:#fffcf9; border-bottom:1px solid #eee; }
      .data-title { font-size:11px; font-weight:600; color:var(--orange); margin-bottom:6px; text-transform:uppercase; }
      .data-array { display:flex; flex-wrap:wrap; gap:5px; min-height:30px; }
      .data-node { width:26px; height:26px; background:var(--orange); color:#fff; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; }
      .log-area { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:11.5px; }
      .log-item { padding:6px 10px; border-radius:4px; background:#fcfcfc; border-left:2px solid #ddd; color:#444; line-height:1.4; }
      .log-item.highlight { border-left-color:var(--orange); background:#fff9f5; font-weight:500; }
      .log-item .log-time { font-size:9px; color:#aaa; margin-bottom:2px; }
      .memo-card { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
      .memo-card h3 { font-size:12px; font-weight:600; margin-bottom:10px; }
      .memo-badges { display:flex; gap:6px; margin-bottom:10px; }
      .memo-badge { padding:2px 8px; border-radius:4px; font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600; }
      .memo-time { background:#fff3ee; color:var(--orange); border:1px solid #f0c8b0; }
      .memo-space { background:#eef3ff; color:var(--blue); border:1px solid #b8d0f0; }
      .memo-tip { padding:6px 9px; font-size:11px; line-height:1.5; color:#555; background:#fffcf9; border-left:3px solid var(--orange); border-radius:0 5px 5px 0; margin-bottom:6px; }
      .memo-tip.g { border-left-color:var(--green); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h1>只出现一次的数字</h1>
        <div class="subtitle">LeetCode 136 · 位运算（异或）</div>
        <div class="control-section">
          <h3>随机种子</h3>
          <input type="number" id="seed-input" class="seed-input" value="13601" onchange="updateSeed()" />
          <button class="button" onclick="randomSeedAndUpdate()">生成随机样例</button>
        </div>
        <div class="control-section">
          <h3>参数控制</h3>
          <div class="control-group">
            <label>动画速度</label>
            <div class="slider-container">
              <input type="range" id="speed" min="0.1" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)" />
              <span class="value-display" id="speed-value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>数组长度（奇数）</label>
            <div class="slider-container">
              <input type="range" id="n" min="5" max="17" step="2" value="9" oninput="updateParam('n', this.value)" />
              <span class="value-display" id="n-value">9</span>
            </div>
          </div>
          <div class="control-group">
            <label>预设样例</label>
            <div class="preset-grid">
              <button class="preset" onclick="setPreset('2,2,1')">2,2,1</button>
              <button class="preset" onclick="setPreset('4,1,2,1,2')">4,1,2,1,2</button>
              <button class="preset" onclick="setPreset('9,7,9,3,7')">9,7,9,3,7</button>
              <button class="preset" onclick="setPreset('6,5,6,8,8')">6,5,6,8,8</button>
            </div>
          </div>
        </div>
        <div class="control-section" style="display:flex; gap:10px">
          <button id="pause-btn" class="button" style="background:var(--dark)" onclick="togglePause()">⏸ 暂停</button>
          <button class="button" style="background:var(--blue)" onclick="resetAnimation()">🔄 重新运行</button>
        </div>
        <div class="memo-card">
          <h3>算法备忘</h3>
          <div class="memo-badges">
            <span class="memo-badge memo-time">时间 O(n)</span>
            <span class="memo-badge memo-space">空间 O(1)</span>
          </div>
          <div class="memo-tip">异或满足交换律和结合律，可以把所有数字顺序折叠到一个累加器里。</div>
          <div class="memo-tip">任意数字和自己异或为 0，和 0 异或保持不变，所以成对数字会相互抵消。</div>
          <div class="memo-tip g">最终累加器值就是唯一出现一次的数字，不需要额外哈希表。</div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-header"><span>异或累加过程可视化</span><span id="result-label">运行中</span></div>
        <div id="canvas-container"></div>
      </div>
      <div class="right-panel">
        <div class="code-box">
          <div class="box-header dark">
            <div class="box-title dark">最优解代码</div>
            <div id="lang-tabs" class="tabs dark">
              <div class="tab" onclick="switchLang('python')">Python</div>
              <div class="tab" onclick="switchLang('ts')">TS</div>
              <div class="tab" onclick="switchLang('java')">Java</div>
              <div class="tab" onclick="switchLang('cpp')">C++</div>
              <div class="tab" onclick="switchLang('c')">C</div>
            </div>
          </div>
          <pre class="code-content"><code id="code-viewer" class="hljs"></code></pre>
        </div>
        <div class="logic-box">
          <div class="box-header"><div class="box-title">执行日志</div></div>
          <div class="data-viz">
            <div class="data-title">数组状态</div>
            <div id="data-nodes" class="data-array"></div>
          </div>
          <div id="log-container" class="log-area"></div>
        </div>
      </div>
    </div>
    <script>
      const SNIPPETS = {
        python: `# Python
def singleNumber(nums: list[int]) -> int:
    # ans 是异或累加器，初值为 0，便于吸收第一个元素
    ans = 0
    for x in nums:
        # 每读到一个数字就执行一次异或折叠
        # 成对数字最终会被抵消，只留下唯一元素
        ans ^= x
    return ans`,
        ts: `// TypeScript
function singleNumber(nums: number[]): number {
  // ans 保存当前异或结果
  let ans = 0;
  for (const x of nums) {
    // 与 Python 同理：按位异或逐步折叠数组
    ans ^= x;
  }
  return ans;
}`,
        java: `// Java
class Solution {
    public int singleNumber(int[] nums) {
        // ans 作为异或累加器，空间复杂度保持 O(1)
        int ans = 0;
        for (int x : nums) {
            // 相同元素成对抵消，唯一元素会留在 ans 中
            ans ^= x;
        }
        return ans;
    }
}`,
        cpp: `// C++
class Solution {
public:
    int singleNumber(vector<int>& nums) {
        // ans 作为异或累加器，初值设为 0
        int ans = 0; // 异或累加器
        for (int x : nums) {
            // 成对元素异或后归零，唯一元素会被保留
            ans ^= x; // 成对元素异或后归零
        }
        return ans;
    }
};`,
        c: `// C
int singleNumber(int* nums, int numsSize) {
    int ans = 0; // 初始化累加器
    for (int i = 0; i < numsSize; i++) {
        // 逐个元素执行异或折叠
        ans ^= nums[i];
    }
    return ans;
}`,
      };

      const LANG_VARS = {
        python: { acc: "ans", cur: "x" },
        ts: { acc: "ans", cur: "x" },
        java: { acc: "ans", cur: "x" },
        cpp: { acc: "ans", cur: "x" },
        c: { acc: "ans", cur: "nums[i]" },
      };

      let params = { seed: 13601, speed: 1.0, n: 9 };
      let currentLang = "python";
      let arr = [];
      let idx = 0;
      let ans = 0;
      let isDone = false;
      let isPaused = false;
      let timer = 0;
      let presetRaw = "";
      let pointerX = -100; // 初始隐藏或重置状态
      let pointerTargetX = -100;

      function setup() {
        const container = document.getElementById("canvas-container");
        const canvas = createCanvas(container.offsetWidth || 500, container.offsetHeight || 600);
        canvas.parent("canvas-container");
        window.addEventListener("resize", () => resizeCanvas(container.offsetWidth, container.offsetHeight));
        switchLang("python");
      }

      function initializeSystem() {
        randomSeed(params.seed);
        arr = presetRaw ? presetRaw.split(",").map((s) => parseInt(s.trim(), 10)) : generateArray(params.n);
        idx = 0;
        ans = 0;
        isDone = false;
        isPaused = false;
        timer = 0;
        
        // 允许 pointerX 在第一次渲染时跳到正确位置
        pointerX = -100; 
        pointerTargetX = -100;
        
        document.getElementById("log-container").innerHTML = "";
        updateDataUI(arr);
        updateResult("运行中", "#888");
        const btn = document.getElementById("pause-btn"); btn.innerHTML = "⏸ 暂停"; btn.style.background = "var(--dark)";
        logMsg(`输入数组：${arr.join(", ")}，${LANG_VARS[currentLang].acc} 初始值为 0。`, true);
      }

      function generateArray(n) {
        const m = (n - 1) / 2;
        const used = new Set();
        const out = [];
        while (used.size < m + 1) used.add(floor(random(1, 20)));
        const vals = Array.from(used);
        const single = vals[0];
        for (let i = 1; i < vals.length; i++) out.push(vals[i], vals[i]);
        out.push(single);
        for (let i = out.length - 1; i > 0; i--) {
          const j = floor(random(i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function draw() {
        background(255);
        drawArray();
        drawAccumulator();
        if (!isDone && !isPaused) {
          timer += 0.018 * params.speed;
          if (timer > 1) {
            timer = 0;
            performStep();
          }
        }
      }

      function drawArray() {
        // 修改：动态计算居中布局和限制最小间距以防重叠
        const minGap = 44; // 方块宽 36，留出 8px 空隙
        const maxGap = 64;
        const gap = Math.max(minGap, Math.min(maxGap, (width - 80) / Math.max(arr.length - 1, 1)));
        const totalWidth = (arr.length - 1) * gap;
        const startX = width / 2 - totalWidth / 2;
        const y = 145;
        
        // 修改：在这里统一管理 targetX，避免布局和逻辑解耦导致的错位
        if (idx < arr.length) {
            pointerTargetX = startX + idx * gap;
        }
        
        if (pointerX === -100) pointerX = pointerTargetX; // 初始对齐
        pointerX = lerp(pointerX, pointerTargetX, 0.12 * params.speed);

        noStroke();
        fill(90);
        textSize(13);
        textAlign(CENTER, CENTER);
        // 修改：标题居中对齐
        text("输入数组 nums", width / 2, 70);

        for (let i = 0; i < arr.length; i++) {
          const cx = startX + i * gap;
          const active = i === idx && !isDone;
          stroke(active ? "#d97757" : "#ddd");
          strokeWeight(active ? 2.2 : 1.2);
          fill(active ? "#fff3ee" : "#fff");
          rect(cx - 18, y - 20, 36, 40, 7);
          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(16);
          text(arr[i], cx, y);
          fill("#aaa");
          textSize(10);
          text(i, cx, y + 30);
        }
        
        if (!isDone) {
          stroke("#d97757");
          strokeWeight(2);
          line(pointerX, y + 50, pointerX, y + 26);
          fill("#d97757");
          noStroke();
          triangle(pointerX, y + 20, pointerX - 5, y + 30, pointerX + 5, y + 30);
          fill("#d97757");
          textSize(11);
          text(LANG_VARS[currentLang].cur, pointerX, y + 66);
        }
      }

      function drawAccumulator() {
        const bx = width / 2 - 90;
        // 修改：将累加器的 Y 坐标固定为相对于数组的固定偏移，避免不同屏幕高度下的变形
        const by = 145 + 130; 
        fill("#fffcf9");
        stroke("#e8e6dc");
        strokeWeight(1.5);
        rect(bx, by, 180, 110, 10);
        noStroke();
        fill("#666");
        textAlign(CENTER, CENTER);
        textSize(12);
        text(`${LANG_VARS[currentLang].acc} (异或累加器)`, bx + 90, by + 24);
        fill("#6a9bcc");
        textSize(36);
        text(ans, bx + 90, by + 68);
      }

      function performStep() {
        if (idx >= arr.length) {
          isDone = true;
          updateResult(`完成，答案 = ${ans}`, "var(--green)");
          logMsg(`遍历结束，${LANG_VARS[currentLang].acc} = ${ans}，即只出现一次的数字。`, true);
          return;
        }
        // 修改：移除了原来在此处计算 pointerTargetX 的硬编码逻辑
        const before = ans;
        const x = arr[idx];
        ans ^= x;
        logMsg(`${LANG_VARS[currentLang].acc} = ${before} ^ ${x} = ${ans}`, x === ans ? true : false);
        idx++;
      }

      function setPreset(s) {
        presetRaw = s;
        params.n = s.split(",").length;
        document.getElementById("n").value = params.n;
        document.getElementById("n-value").textContent = params.n;
        initializeSystem();
      }

      function updateResult(text, color) {
        const el = document.getElementById("result-label");
        el.textContent = text;
        el.style.color = color;
      }

      function updateDataUI(array) {
        const container = document.getElementById("data-nodes");
        container.innerHTML = "";
        array.forEach((v) => {
          const node = document.createElement("div");
          node.className = "data-node";
          node.textContent = v;
          container.appendChild(node);
        });
      }

      function logMsg(msg, highlight = false) {
        const container = document.getElementById("log-container");
        const item = document.createElement("div");
        item.className = "log-item" + (highlight ? " highlight" : "");
        const time = new Date().toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        item.innerHTML = `<div class="log-time">${time}</div>${msg}`;
        container.appendChild(item);
        container.scrollTop = container.scrollHeight;
      }

      function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        const map = { python: 0, ts: 1, java: 2, cpp: 3, c: 4 };
        document.querySelectorAll(".tab")[map[lang]].classList.add("active");
        const codeEl = document.getElementById("code-viewer");
        const hl = { python: "language-python", ts: "language-typescript", java: "language-java", cpp: "language-cpp", c: "language-c" };
        codeEl.className = "hljs " + hl[lang];
        codeEl.textContent = SNIPPETS[lang];
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) hljs.highlightElement(codeEl);
        if (typeof initializeSystem === "function") initializeSystem();
      }

      function updateParam(id, val) {
        if (id in params) params[id] = parseFloat(val);
        document.getElementById(id + "-value").textContent = val;
        if (id !== "speed") {
          presetRaw = "";
          initializeSystem();
        }
      }

      function updateSeed() {
        params.seed = parseInt(document.getElementById("seed-input").value, 10) || 13601;
        presetRaw = "";
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = floor(random(1, 99999));
        document.getElementById("seed-input").value = params.seed;
        presetRaw = "";
        initializeSystem();
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById("pause-btn");
        if (isPaused) {
          btn.innerHTML = "▶ 继续";
          btn.style.background = "var(--green)";
        } else {
          btn.innerHTML = "⏸ 暂停";
          btn.style.background = "var(--dark)";
        }
      }

      function resetAnimation() {
        initializeSystem();
      }
    </script>
  </body>
</html>
