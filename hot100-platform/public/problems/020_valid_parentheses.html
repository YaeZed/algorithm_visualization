    <script>
      const SNIPPETS = {
        python: `# Python
class Solution:
    def isValid(self, s: str) -> bool:
        # pairs 保存“右括号 -> 左括号”的映射。
        # 这样遇到右括号时，可以 O(1) 知道它期待栈顶是哪一种左括号。
        pairs = {')': '(', ']': '[', '}': '{'}

        # stack 只存还没有被匹配掉的左括号。
        # 栈顶 stack[-1] 永远代表“最近打开、必须最先关闭”的那一层括号。
        stack = []

        for ch in s:
            if ch in pairs:
                # 当前字符是右括号：它不能单独出现，必须匹配最近的左括号。
                # not stack 说明右括号多了；stack[-1] != pairs[ch] 说明类型错了。
                if not stack or stack[-1] != pairs[ch]:
                    return False

                # 匹配成功后，弹出栈顶，表示这一对括号已经闭合。
                stack.pop()
            else:
                # 当前字符是左括号：先入栈，等待后续某个右括号来关闭它。
                stack.append(ch)

        # 扫描结束后，栈必须为空。
        # 如果 stack 里还有元素，说明存在没有被关闭的左括号。
        return not stack`,
        ts: `// TypeScript
function isValid(s: string): boolean {
  // pairs 的 key 是右括号，value 是它必须匹配的左括号。
  // 用 Map 可以避免写一长串 if/else 来判断括号类型。
  const pairs = new Map<string, string>([
    [")", "("],
    ["]", "["],
    ["}", "{"],
  ]);

  // stack 存放尚未匹配的左括号，数组末尾充当栈顶。
  // push/pop 都作用在数组末尾，符合后进先出的栈语义。
  const stack: string[] = [];

  for (const ch of s) {
    if (pairs.has(ch)) {
      // 当前是右括号：栈必须非空，并且栈顶必须正好是它需要的左括号。
      // 例如 ch 为 ")" 时，栈顶必须是 "("。
      if (stack.length === 0 || stack[stack.length - 1] !== pairs.get(ch)) return false;

      // 一旦匹配成功，就弹出这层已经闭合的左括号。
      stack.pop();
    } else {
      // 当前是左括号，只能先压栈等待后续匹配。
      stack.push(ch);
    }
  }

  // 所有字符处理完后，栈为空才表示每个左括号都被正确关闭。
  return stack.length === 0;
}`,
        java: `// Java
class Solution {
    public boolean isValid(String s) {
        // ArrayDeque 用作栈，比历史类 Stack 更推荐。
        // push/pop/peek 都在同一端操作，时间复杂度为 O(1)。
        Deque<Character> stack = new ArrayDeque<>();

        for (char ch : s.toCharArray()) {
            if (ch == '(' || ch == '[' || ch == '{') {
                // 左括号表示打开一层新的括号结构，先压入栈顶。
                stack.push(ch);
            } else {
                // 右括号不能在没有左括号的情况下出现，否则立即无效。
                if (stack.isEmpty()) return false;

                // 弹出最近的左括号，检查它是否能和当前右括号组成一对。
                char top = stack.pop();

                // 三种括号必须严格同类型匹配；交叉匹配如 ([)] 会在这里失败。
                if (ch == ')' && top != '(') return false;
                if (ch == ']' && top != '[') return false;
                if (ch == '}' && top != '{') return false;
            }
        }

        // 如果栈里还剩左括号，说明它们没有被关闭。
        return stack.isEmpty();
    }
}`,
        cpp: `// C++
class Solution {
public:
    bool isValid(string s) {
        // vector<char> 作为栈使用：back() 是栈顶，push_back/pop_back 操作栈顶。
        // 对这题来说不需要真正的 std::stack，vector 更直观地展示底层内容。
        vector<char> st;

        for (char ch : s) {
            if (ch == '(' || ch == '[' || ch == '{') {
                // 左括号入栈，表示它还没有找到对应的右括号。
                st.push_back(ch);
            } else {
                // 遇到右括号时，如果栈为空，说明没有左括号可以匹配它。
                if (st.empty()) return false;

                // 取出最近的左括号；只有最近打开的括号允许最先关闭。
                char top = st.back();
                st.pop_back();

                // 当前右括号和刚弹出的左括号必须类型一致。
                if (ch == ')' && top != '(') return false;
                if (ch == ']' && top != '[') return false;
                if (ch == '}' && top != '{') return false;
            }
        }

        // st 为空表示没有遗留未闭合的左括号。
        return st.empty();
    }
};`,
        c: `// C
bool isValid(char* s) {
    int n = strlen(s);

    // C 没有内置栈，这里手动申请一个 char 数组作为栈。
    // 最坏情况下字符串全是左括号，因此栈容量最多需要 n。
    char* stack = (char*)malloc(sizeof(char) * n);

    // top 指向当前栈顶下标；-1 表示栈为空。
    int top = -1;

    for (int i = 0; i < n; i++) {
        char ch = s[i];
        if (ch == '(' || ch == '[' || ch == '{') {
            // 左括号压栈：先移动 top，再把字符写入新的栈顶位置。
            stack[++top] = ch;
        } else {
            // 右括号到来时，top < 0 说明栈空，无法匹配。
            // 返回前必须释放 malloc 出来的内存。
            if (top < 0) { free(stack); return false; }

            // 弹出最近的左括号，并让 top 回退一格。
            char left = stack[top--];

            // 检查括号类型是否完全对应，任意一类不匹配都直接失败。
            if (ch == ')' && left != '(') { free(stack); return false; }
            if (ch == ']' && left != '[') { free(stack); return false; }
            if (ch == '}' && left != '{') { free(stack); return false; }
        }
    }

    // top == -1 表示没有残留左括号。
    bool ok = (top == -1);
    free(stack);
    return ok;
}`,
      };

      function generateInput() {
        const opens = ["(", "[", "{"];
        const closes = { "(": ")", "[": "]", "{": "}" };
        const arr = [];
        const temp = [];
        for (let i = 0; i < params.n; i++) {
          const shouldClose = temp.length > 0 && random() < 0.48;
          if (shouldClose) {
            const left = temp.pop();
            arr.push(random() < 0.82 ? closes[left] : random([")", "]", "}"]));
          } else {
            const left = random(opens);
            temp.push(left);
            arr.push(left);
          }
        }
        return arr.slice(0, params.n);
      }
      function draw() {
        background(255);
        drawInput();
        drawStack();
        drawLegend();
        if (!isDone && !isPaused) {
          p5Timer += 0.018 * params.speed;
          if (p5Timer > 1) {
            p5Timer = 0;
            performStep();
          }
        }
      }
      function performStep() {
        if (stepIndex >= inputChars.length) {
          isDone = true;
          if (stack.length === 0) {
            status = "valid";
            updateResult("有效", "var(--anthropic-green)");
            logMsg("扫描结束且栈为空：所有括号都正确闭合。", true);
          } else {
            status = "invalid";
            updateResult("无效", "var(--danger)");
            logMsg(`扫描结束但栈中还剩 ${stack.join("")}。`, true);
          }
          return;
        }
        const ch = inputChars[stepIndex];
        const closeToOpen = { ")": "(", "]": "[", "}": "{" };
        charBoxes[stepIndex].state = "active";
        pointerTargetX = 80 + stepIndex * getGap();
        logMsg(`读取 ${LANG_VARS[currentLang].current} = "${ch}"。`, false);
        if (!(ch in closeToOpen)) {
          stack.push(ch);
          stackBoxes.push({ ch, x: width - 120, y: height - 120, alpha: 0 });
          charBoxes[stepIndex].state = "pushed";
          logMsg(`"${ch}" 是左括号，压入 ${LANG_VARS[currentLang].stack}。`, true);
        } else {
          const need = closeToOpen[ch];
          const top = stack.length ? stack[stack.length - 1] : null;
          if (top === need) {
            stack.pop();
            stackBoxes.pop();
            charBoxes[stepIndex].state = "matched";
            logMsg(`"${ch}" 与栈顶 ${LANG_VARS[currentLang].top} = "${top}" 匹配。`, true);
          } else {
            charBoxes[stepIndex].state = "bad";
            status = "invalid";
            isDone = true;
            updateResult("无效", "var(--danger)");
            logMsg(top === null ? `"${ch}" 是右括号，但栈为空。` : `"${ch}" 需要 "${need}"，但栈顶是 "${top}"。`, true);
          }
        }
        stepIndex++;
        updateDataUI(stack);
      }
      function drawInput() {
        const gap = getGap();
        const startX = 80;
        const y = 105;
        pointerX = lerp(pointerX, pointerTargetX, 0.12 * params.speed);
        textAlign(LEFT, CENTER);
        textSize(13);
        fill(100);
        noStroke();
        text("输入字符串", 30, 45);
        for (let i = 0; i < charBoxes.length; i++) {
          const box = charBoxes[i];
          box.x = lerp(box.x || startX + i * gap, startX + i * gap, 0.15);
          box.y = lerp(box.y || y, y, 0.15);
          let fillColor = "#fff";
          let strokeColor = "#ddd";
          if (box.state === "active") { fillColor = "#fff3ee"; strokeColor = "#d97757"; }
          if (box.state === "pushed") { fillColor = "#eef3ff"; strokeColor = "#6a9bcc"; }
          if (box.state === "matched") { fillColor = "#eef6ea"; strokeColor = "#788c5d"; }
          if (box.state === "bad") { fillColor = "#fff0f0"; strokeColor = "#c75f5f"; }
          stroke(strokeColor);
          strokeWeight(2);
          fill(fillColor);
          rect(box.x - 18, box.y - 22, 36, 44, 7);
          noStroke();
          fill("#222");
          textAlign(CENTER, CENTER);
          textSize(22);
          text(box.ch, box.x, box.y - 2);
          fill("#aaa");
          textSize(10);
          text(i, box.x, box.y + 35);
        }
        if (!isDone) {
          stroke("#d97757");
          strokeWeight(2);
          line(pointerX, y + 52, pointerX, y + 25);
          fill("#d97757");
          noStroke();
          triangle(pointerX, y + 20, pointerX - 5, y + 29, pointerX + 5, y + 29);
          textSize(11);
          text(LANG_VARS[currentLang].current, pointerX, y + 68);
        }
      }
      function drawStack() {
        const baseX = width / 2;
        const baseY = height - 120; // Moved stack base up
        const cellH = 42;
        textAlign(CENTER, CENTER);
        noStroke();
        fill(100);
        textSize(13);
        text(`${LANG_VARS[currentLang].stack} 栈`, baseX, baseY - 245);
        stroke("#ddd");
        strokeWeight(2);
        noFill();
        rect(baseX - 35, baseY - 220, 70, 220, 7);
        for (let i = 0; i < stackBoxes.length; i++) {
          const box = stackBoxes[i];
          const targetX = baseX;
          const targetY = baseY - 25 - i * cellH;
          box.x = lerp(box.x, targetX, 0.12 * params.speed);
          box.y = lerp(box.y, targetY, 0.12 * params.speed);
          box.alpha = lerp(box.alpha, 255, 0.12);
          fill(217, 119, 87, box.alpha);
          stroke("#c86641");
          rect(box.x - 26, box.y - 17, 52, 34, 6);
          noStroke();
          fill(255);
          textSize(22);
          text(box.ch, box.x, box.y - 1);
        }
        if (stackBoxes.length) {
          const topBox = stackBoxes[stackBoxes.length - 1];
          fill("#6a9bcc");
          noStroke();
          textSize(11);
          text(LANG_VARS[currentLang].top, topBox.x + 80, topBox.y);
          stroke("#6a9bcc");
          line(topBox.x + 48, topBox.y, topBox.x + 18, topBox.y);
        } else {
          fill("#aaa");
          noStroke();
          textSize(12);
          text("empty", baseX, baseY - 110);
        }
      }
      function drawLegend() {
        const x = 30;
        const y = height - 80; // Moved rules down
        noStroke();
        fill("#666");
        textAlign(LEFT, CENTER);
        textSize(12);
        text("规则：左括号入栈；右括号必须匹配栈顶；结束后栈必须为空。", x, y);
        fill(status === "valid" ? "#788c5d" : status === "invalid" ? "#c75f5f" : "#999");
        textSize(24);
        text(status === "valid" ? "TRUE" : status === "invalid" ? "FALSE" : "CHECKING", x, y + 32);
      }
      function getGap() { return Math.max(28, Math.min(48, (width - 150) / Math.max(inputChars.length - 1, 1))); }
      function setPreset(value) { presetValue = value; params.n = value.length; document.getElementById("n").value = value.length; document.getElementById("n-value").textContent = value.length; initializeSystem(); }
      function updateResult(text, color) { const el = document.getElementById("result-label"); el.textContent = text; el.style.color = color; }
      function updateDataUI(arr) { const container = document.getElementById("data-nodes"); if (!container) return; container.innerHTML = ""; arr.forEach((v) => { const node = document.createElement("div"); node.className = "data-node"; node.innerText = v; container.appendChild(node); }); }
      function logMsg(msg, highlight = false) { const container = document.getElementById("log-container"); if (!container) return; const item = document.createElement("div"); item.className = "log-item" + (highlight ? " highlight" : ""); const time = new Date().toLocaleTimeString("zh-CN", { hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit" }); item.innerHTML = `<div class="time">${time}</div>${msg}`; container.appendChild(item); container.scrollTop = container.scrollHeight; }
      function switchLang(lang) { currentLang = lang; document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active")); const tabs = document.querySelectorAll(".tab"); const langMap = { python:0, ts:1, java:2, cpp:3, c:4 }; tabs[langMap[lang]].classList.add("active"); const codeEl = document.getElementById("code-viewer"); const hljsMap = { python:"language-python", ts:"language-typescript", java:"language-java", cpp:"language-cpp", c:"language-c" }; codeEl.className = "hljs " + hljsMap[lang]; codeEl.textContent = SNIPPETS[lang]; codeEl.removeAttribute("data-highlighted"); if (window.hljs) hljs.highlightElement(codeEl); if (typeof initializeSystem === "function") initializeSystem(); }
      function updateParam(id, val) { if (id in params) params[id] = parseFloat(val); const display = document.getElementById(id + "-value"); if (display) display.textContent = val; if (id !== "speed") { presetValue = ""; initializeSystem(); } }
      function updateSeed() { params.seed = parseInt(document.getElementById("seed-input").value) || 12345; presetValue = ""; initializeSystem(); }
      function randomSeedAndUpdate() { params.seed = floor(random(1, 99999)); document.getElementById("seed-input").value = params.seed; presetValue = ""; initializeSystem(); logMsg("已生成新的随机括号串。", true); }
      function togglePause() { isPaused = !isPaused; const btn = document.getElementById("pause-btn"); if (!btn) return; if (isPaused) { btn.innerHTML = "继续"; btn.style.background = "var(--anthropic-green)"; } else { btn.innerHTML = "暂停"; btn.style.background = "var(--anthropic-dark)"; } }
      function resetAnimation() { initializeSystem(); }
    </script>
  </body>
</html>
